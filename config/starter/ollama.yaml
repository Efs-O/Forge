# Forge starter config — Ollama
# Replace the model tag with one shown by `ollama list`, then validate.

active_model: qwen3.5:9b

models:
  - name: qwen3.5:9b
    provider: ollama
    endpoint: http://127.0.0.1:11434
    num_ctx: 32768

permissions:
  # A coding agent needs to run builds and tests. Every write, delete, command
  # and git action still asks for confirmation unless /clanker is on.
  fs: { read: true, write: true, delete: true }
  net: { search: false, fetch: false }
  exec: { headless: true }
  git: { read: true, write: true }

# The tested agent setup. Auto-compaction and the auto-created FORGE.md are
# off unless named here. max_tokens is a ceiling: each request is clamped to
# the room the context leaves.
forge_instructions:
  auto_create: true

auto_compact:
  enabled: true
  at: 0.85
  resume: true

defaults:
  sampling: { temperature: 0.6, top_p: 0.95, max_tokens: 200000 }
  system_prompt: |
    Be brief. Think only as long as the next action needs; do not re-verify what a tool result already showed.
    Batch independent tool calls in one response. Search many files in one command, not one call per file.
    When the task is done and the evidence is in hand, stop and give a short answer.
    Before you call a change done, run the narrowest check that proves it (the relevant test, build or a re-read of the edited lines); report what you ran and what it showed.
    Do not claim anything you have not seen in a tool result.
