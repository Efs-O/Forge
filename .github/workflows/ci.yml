name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # windows-latest has 4 CPUs, so vitest's default is 3 workers, and under that
      # load timing-bound tests miss their deadlines there (2026-10-23). Vitest
      # reads VITEST_MAX_WORKERS itself; empty on the other OSes means the default.
      - name: Quality gates
        env:
          VITEST_MAX_WORKERS: ${{ matrix.os == 'windows-latest' && '2' || '' }}
        run: npm run ci

      - name: Release build + package
        run: npm run package
