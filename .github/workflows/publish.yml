name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (for a recovery run)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    # `contents: write` is what lets the release step create a release with the
    # default GITHUB_TOKEN; the default for this repo is read-only.
    permissions:
      contents: write
    # Lifted to job level because the `secrets` context is NOT available in a
    # step-level `if` -- using it there is not a false condition, it is an
    # invalid workflow, and GitHub fails the run at 0s before any step. `env`
    # IS available there, so the guard reads the secret through this.
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      REQUESTED_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: npm run ci

      # The release is the artifact the canonical `npm run package` gate built
      # (version check, release build, changelog sync), published as-is to
      # every registry. Publishing through `npm run publish` let vsce repackage
      # on its own path, skipping check-vsix-version.mjs (audit A11, 2026-09-21).
      # The tag must name the version being packaged, or the release page and
      # the registries disagree about what shipped.
      - name: Package the VSIX
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
              exit 1
            fi
          elif [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$VERSION" ]; then
            echo "Requested version $REQUESTED_VERSION does not match package.json version $VERSION" >&2
            exit 1
          fi
          npm run package
          test -f "forge-llm-$VERSION.vsix"

      - name: Publish to VS Code Marketplace
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce publish --packagePath "forge-llm-$VERSION.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Open VSX lagged the Marketplace from 0.13.3 to 0.15.0 because the step
      # that published it was deleted in a954ead and never restored. It is
      # guarded on the secret rather than assumed: without the guard a missing
      # OVSX_PAT fails the job AFTER the Marketplace publish has already gone
      # out, turning a half-finished release into a red one. Set the secret
      # with `gh secret set OVSX_PAT` and this starts running on the next tag.
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx ovsx publish "forge-llm-$VERSION.vsix" -p "$OVSX_PAT"

      # The releases page stopped at v0.12.29 while 0.13, 0.14 and 0.15 shipped
      # to both registries: nothing here ever created one. Notes are cut from
      # CHANGES.md rather than written a second time, and the VSIX is attached
      # so the exact artifact the registries received is downloadable from the
      # repo too. Last, so a registry failure does not leave a release
      # announcing a version that never went out.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          node scripts/release-notes.mjs "$VERSION" release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "forge-llm-$VERSION.vsix" --clobber
            gh release edit "$TAG" \
              --title "Forge LLM $TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" "forge-llm-$VERSION.vsix" \
              --title "Forge LLM $TAG" \
              --notes-file release-notes.md
          fi
