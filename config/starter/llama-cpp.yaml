# Forge starter config — llama.cpp
# Replace the two marked paths, then run "Forge: Validate Config".

active_model: local-model

llama_server:
  binary: /REPLACE/WITH/PATH/TO/llama-server

models:
  - name: local-model
    provider: llama.cpp
    gguf_path: /REPLACE/WITH/PATH/TO/model.gguf
    spawn:
      num_ctx: 32768
      # Every layer on GPU. NOT -1 — on llama.cpp b10430+ that means auto-fit,
      # which quietly leaves part of the model on the CPU.
      n_gpu_layers: 999
      flash_attn: true
      extra_llama_server_args:
        # How much of the prompt is re-evaluated when an edit lands mid-prompt.
        # llama.cpp can only rewind cached state to a checkpoint, and its default
        # spacing (8192) is coarser than a chat edit — measured 7272 re-evaluated
        # tokens vs 32 at 1024, for no extra VRAM. Safe to delete if unsupported
        # by your llama.cpp build.
        - "--checkpoint-min-step"
        - "1024"

permissions:
  # An approval card nobody answers is declined after this many minutes, so a
  # turn cannot sit open forever. Delete the line to wait forever instead.
  approval_timeout_minutes: 10
  # A coding agent needs to run builds and tests. Every write, delete, command
  # and git action still asks for confirmation unless /clanker is on. Browser
  # and desktop control are off until setup turns them on. Search stays off
  # until setup adds it.
  fs: { read: true, write: true, delete: false }
  net: { search: false, fetch: true }
  exec: { headless: true }
  git: { read: true, write: false }
  agents: { delegate: false }
  # New-chat and steer actions stay off until explicitly enabled.
  chats: { new_chat: false, steer: false, new_chats_per_hour: 100 }
  browser: { enabled: false }
  desktop: { enabled: false }

# Off until setup turns them on: the agent bus, remote control and scheduled
# jobs. The control server stays on; it is loopback only.
control_server:
  enabled: true
agent_bus:
  enabled: false
remote:
  enabled: false
jobs:
  enabled: false
  allow_cli_agents: false

# The tested agent setup. Auto-compaction and the auto-created FORGE.md are
# off unless named here. max_tokens is a ceiling: each request is clamped to
# the room the context leaves.
forge_instructions:
  auto_create: true

auto_compact:
  enabled: true
  at: 0.85
  resume: true

defaults:
  sampling: { temperature: 0.6, top_p: 0.95, max_tokens: 200000 }
