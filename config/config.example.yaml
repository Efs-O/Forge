  gemma4-e4b-it-ud-q4kxl: gemma4-e4b-it-ud-q4kxl-vision
  qwen38-27b-mtp-ud-q4kxl: qwen38-27b-mtp-ud-q4kxl-vision
  qwen38-27b-dflash2-ud-q6k: qwen38-27b-dflash2-ud-q6k-vision
