# ===========================================================================
# C. LOCAL RUNTIME & RESOURCES
# ===========================================================================

llama_server:
  binary: "xxxx/llama-server.exe"
  # Apply verbose llama.cpp logging to every llama-server process.
  extra_llama_server_args: ["--verbose"]
  host: "127.0.0.1"
  port: 8080
  flash_attn_default: true

max_simultaneous_models: 4

shared_runtime:
  enabled: true

control_server:
  enabled: true
  port: 8799

benchmark:
  base_url: "http://127.0.0.1:8084"

auto_compact:
  enabled: true
  at: 0.85
  resume: true

# Off unless this block is present and enabled. Dumps contain complete model
# request bodies (messages and tool schemas); authorization headers are never
# recorded. Expired files are removed on extension activation.
# record_requests:
#   enabled: true
#   max_mb: 500
#   keep_hours: 24

# DuckDuckGo needs no API key. Store the fallback provider's key with
# "Forge: Set Search API Key"; keys remain in VS Code SecretStorage.
search:
  provider: duckduckgo
  fallback: tavily
  max_results: 20

embeddings:
  enabled: false
  model_path: "xxxx/embeddinggemma-300m-Q4_0.gguf"
  port: 8091
  device: none         # CPU: the 300M embedder is fast there and keeps GPU VRAM free
  prompt_style: gemma
  auto_index_on_search: true
  confirm_on_start: true
  idle_timeout_ms: 120000
  max_file_size_kb: 256
  include_globs: [ "**/src/**", "**/test/**", "**/tests/**", "**/docs/**" ]
  exclude_globs: [ "**/node_modules/**", "**/dist/**", "**/out/**", "**/.git/**", "**/.forge/**" ]

# generate_image tool (xAI grok-imagine, ~$0.04 per image).
# Disabling the `fetch` permission disables this tool entirely -- including a
# local sdcpp backend below: the image is fetched over localhost HTTP, so the
# permission gate is the same one. Turning fetch off is not a way to keep the
# tool but refuse the network.
image_generation:
  default: grok-imagine
  output_dir: generated-images
  backends:
    - name: grok-imagine
      provider: xai
      model: grok-imagine-image-2.0
      api_key_secret: xai
      confirm_each: true
    # Local image generation via stable-diffusion.cpp (docs/plans/
    # LOCAL_IMAGE_GENERATION_PLAN.md). Free per image, but it occupies a GPU:
    # Forge spawns sd-server.exe on `port` (127.0.0.1 only), refuses to start it
    # unless `min_free_vram_mb` is free on `cuda_device`, and stops it after
    # `idle_timeout_ms` idle. All four paths are required, with no discovery.
    # `cuda_device` is the nvidia-smi / PCI-bus ordinal, the same convention as
    # voice.compute.device. idle_timeout_ms must be at least
    # request_timeout_ms + 60000. `size` selects a shape; this backend's
    # optional `sizes` table sets its pixel dimensions.
    # Tested with stable-diffusion.cpp release master-929-3f8527a and Qwen-Image-2.1
    # Turbo; AI_SETUP.md step 10 lists the official download for every file.
    # - name: qwen-image-local
    #   provider: sdcpp
    #   binary: "path/to/sd-server.exe"
    #   diffusion_model: "path/to/qwen-image-2.1-turbo-Q4_K_M.gguf"
    #   text_encoder: "path/to/Qwen3VL-8B-Instruct-Q4_K_M.gguf"
    #   vision_encoder: "path/to/mmproj-Qwen3VL-8B-Instruct-F16.gguf"  # needed for reference_paths edits
    #   vae: "path/to/qwen_image_2.1_vae_bf16.safetensors"
    #   cuda_device: 2
    #   text_encoder_on_cpu: false
    #   port: 8093
    #   min_free_vram_mb: 11200   # measured sd-server peak at 864x1536 / 10.25, plus a little
    #   idle_timeout_ms: 300000
    #   request_timeout_ms: 240000  # Turbo edit is ~93 s; idle must be >= request + 60000
    #   max_vram_gib: 10.25      # fractional caps are supported
    #   defaults: { steps: 8, cfg_scale: 1.0, sampler: euler, width: 864, height: 1536, seed: 7 }
    #   sizes:
    #     square: { width: 1152, height: 1152 }
    #     portrait: { width: 864, height: 1536 }
    #     landscape: { width: 1536, height: 864 }
    #   # 8-step Turbo needs its own sigma schedule; startup flag is enough, no request field.
    #   # --vae-tiling + --vae-relative-tile-size 2 decode in 2 big tiles: on a 12 GB card the
    #   # whole-frame decode runs out of memory from the second render on and falls back to
    #   # 55 small tiles (12-15 s); 2 tiles take ~7 s every time with the same picture.
    #   extra_args: ["--offload-to-cpu", "--sigmas", "1.0,0.978453,0.95418,0.926626,0.89508,0.845148,0.704534,0.414568,0.0", "--vae-tiling", "--vae-relative-tile-size", "2"]
    #   confirm_on_start: true    # ask once before the GPU is occupied
    #   confirm_each: false       # free per image, so no per-call prompt
    #   media_gpu_lease_enabled: false  # opt in to sharing ~/.forge/media-gpu/lease.json with media skills
  # upscale_image (ESRGAN x4, one sd-cli run per call; frees its VRAM on exit).
  # Without this block the tool is not registered. Use sd-cli, not sd-server.
  # upscale:
  #   binary: "path/to/sd-cli.exe"
  #   model: "path/to/4x_foolhardy_Remacri.pth"
  #   cuda_device: 2
  #   min_free_vram_mb: 1500    # measured ESRGAN peak ~0.6 GB, plus room for the display
  #   timeout_ms: 300000        # 864x1536 took 47 s on an RTX 3060
  #   max_input_edge_px: 2048   # a 2048 px input becomes 8192 px

# view_video frame sampling (needs ffmpeg/ffprobe on PATH or ffmpeg_path).
# frame_max_dimension is the context knob. Measured on a 5 s clip with
# Qwen3.8-27B: unscaled 1920x1088 = 22,501 prompt tokens, 640 px = 2,479,
# 384 px = 983.
video:
  frame_max_dimension: 640

