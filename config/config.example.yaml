# Forge config example — F6 models-vs-profiles shape
#
# Copy this file to <your-project>/.forge/config.yaml and edit.
# The setup wizard (first run) can also generate this file for you.
#
# All paths are absolute or relative to the workspace root.
# API keys are stored in VS Code SecretStorage — never put them here.
#
# THREE layers decide what a request looks like:
#   models:   one entry per GGUF/endpoint — FACTS ONLY. Spawn-time facts for
#             llama.cpp live under `spawn:`. Vision is auto-derived from
#             `mmproj_path` (no `capabilities: [vision]` needed).
#   defaults: request-time fields shared by every model (system_prompt, sampling).
#   profiles: request-time role presets, selected via `active_model: name@profile`.
#
# Merge precedence (request-time): defaults < model fields < profile.
# Spawn-time:                      model flat/spawn < spawn_profiles[<name>].

# Model to activate on startup. `name` or `name@profile` (profile optional).
active_model: my-model@main

# Optional command capability for native local models. `headless` exposes
# shell-free direct commands plus Forge's structured read-only PowerShell
# inspection tool; ordinary terminal pasting remains off unless enabled too.
# NOTE: a permissions block naming only `exec` denies every OTHER group by
# schema default. Prefer the full block near the bottom of this file.
# permissions:
#   exec:
#     headless: true

# -------------------------------------------------------------------
# llama-server settings (direct GGUF mode)
# -------------------------------------------------------------------
llama_server:
  binary: /path/to/llama-server      # required for direct mode
  host: 127.0.0.1
  port: 8080

# Opt-in: let other Forge VS Code windows borrow a compatible direct
# llama.cpp runtime. Unload releases this workspace's lease; the owner will
# not stop while another workspace is borrowing it.
# shared_runtime:
#   enabled: true
  # NOTE (llama.cpp b10430+): `-ngl` is an AUTO-FIT parameter ("exact number,
  # 'auto', or 'all'; default auto"), not a plain "all layers" switch. Auto holds
  # back a ~1024 MiB margin and may leave a layer on CPU. On hybrid architectures
  # (Gated Delta Net / linear-attention models) ONE layer on CPU makes llama.cpp
  # disable the fused kernel for the WHOLE model — a >2x generation hit, not a
  # proportional one. An explicit count also DISABLES auto-fit entirely
  # ("already set by user to N, abort"), so the memory budget becomes yours —
  # which is why 999 ("every layer") is the default here and what Forge uses when
  # this key is absent. A model that no longer fits then fails loudly at startup
  # instead of silently half-running on the CPU; lower num_ctx, or set a real
  # layer count here, rather than going back to -1.
  n_gpu_layers: 999
  default_num_ctx: 32768             # fallback when a model omits num_ctx/spawn.num_ctx
  n_batch: 512
  n_parallel: 4                      # default concurrent worker slots
  # KV cache quantization. q8_0 is the safe default; q4_0 roughly halves KV VRAM
  # at some cost to long-context recall precision — worth it only when the saving
  # keeps layers on the GPU that would otherwise spill.
  type_k: q8_0
  type_v: q8_0
  flash_attn_default: true

  # Sizing num_ctx by hand? `llama-fit-params` (ships with llama.cpp) prints the
  # exact per-device split:
  #   llama-fit-params -m MODEL -ngl all --fit off -fitp on -c N --cache-type-k q4_0
  #   -> "CUDA0 <model> <ctx> <compute>"  (MiB)
  # Two gotchas: it REJECTS --spec-type, so a speculative/MTP draft context is NOT
  # counted (budget it by hand — it can be ~700-900 MiB), and note that --ctx-size
  # is the TOTAL split across n_parallel slots, so per-slot ctx = num_ctx/n_parallel.
  # Leave headroom: on Windows, WDDM does not fail a too-tight allocation, it pages
  # VRAM over PCIe and throughput collapses. Keep >= ~1 GB free.

# -------------------------------------------------------------------
# Request-time defaults — applied beneath each model's own fields and profile.
# -------------------------------------------------------------------
defaults:
  # NOTE: this is APPENDED beneath Forge's built-in template (execute.njk),
  # which already establishes the coding-agent persona and tool rules. To send
  # a prompt INSTEAD of the template — e.g. for a fine-tune that must not be
  # told it is Forge — set `system_prompt_mode: replace` on that model.
  # Caveat: `replace` also drops the template's fenced-JSON tool-call fallback,
  # so pair it with `strip_tools: true` or a natively tool-calling model.
  system_prompt: |
    You are Forge, a local AI coding assistant running inside VS Code.
    ALWAYS use tools to accomplish tasks. Never just describe what you would do.
    After each tool result, continue until the task is complete, then summarize.
  sampling:
    temperature: 0.6
    top_p: 0.95
    # Upper bound only. Forge lowers this per request to the room actually left
    # in the slot (num_ctx / n_parallel, minus the prompt), so a value larger
    # than the context is harmless — but a small one still binds.
    max_tokens: 8192

# -------------------------------------------------------------------
# Request-time role presets. One loaded GGUF serves every role.
# -------------------------------------------------------------------
profiles:
  main:                              # interactive coding driver
    think: true
    reasoning_effort: medium
  subcoordinator:                    # plans + delegates
    think: true
    reasoning_effort: low
  worker:                            # headless fleet worker — no reasoning
    think: false
    reasoning_effort: none
    sampling:
      temperature: 0.2

# -------------------------------------------------------------------
# Optional back-compat aliases: old name -> base@profile.
# -------------------------------------------------------------------
# aliases:
#   my-model-worker: my-model@worker

# -------------------------------------------------------------------
# Automatic context compaction (optional, OFF by default).
# /compact summarizes the conversation and sends the model that summary plus
# the recent turns. It is non-destructive: your chat transcript is kept whole,
# only what the model is sent shrinks.
# `at` is the fraction of the context window that triggers it. Keep it well
# under 1.0 — the summarization request itself sends the transcript, so at
# ~0.95 there is no room left for it to run. Max accepted is 0.95.
# -------------------------------------------------------------------
# `resume` continues the active task from the summary and retained tail once
# the context has been freed. Default true.
# A user-typed /compact never resumes at all.
# -------------------------------------------------------------------
# auto_compact:
#   enabled: true
#   at: 0.85
#   resume: true

# Create a small FORGE.md in every discovered repository that does not have
# one. Forge prefers FORGE.md over AGENTS.md and injects the repository-specific
# file into native local-agent prompts; it never overwrites existing files.
# forge_instructions:
#   auto_create: true

# -------------------------------------------------------------------
# Control server (optional) — localhost API so an external orchestrator can
# load models on demand and discover the OpenAI-compatible endpoint.
#   GET /healthz  GET /models  POST /ensure {model}  POST /release {model}
#   POST /unload {model}  POST /chat {model, messages}   (model may be name@profile)
# -------------------------------------------------------------------
# control_server:
#   enabled: true
#   port: 8799

# -------------------------------------------------------------------
# Ollama daemon supervision (optional) — when a model's LOCAL Ollama endpoint
# refuses connection, Forge can start "ollama serve" itself. Remote endpoints
# are never auto-started.
# -------------------------------------------------------------------
# ollama:
#   auto_start: true                   # default: true
#   executable: C:\path\to\ollama.exe  # only for non-standard installs

# -------------------------------------------------------------------
# Optional: groups — shared settings folded into every model that names them.
# Precedence: defaults < group(s) < the model's own fields. `sampling`, `spawn`
# and `tool_call_limits` merge key by key; EVERY OTHER FIELD IS A WHOLESALE
# OVERRIDE. That matters most for `capabilities`: a model adding `vision` must
# restate `tool-call` here or it silently loses tool calling.
# -------------------------------------------------------------------
# groups:
#   external-agents:
#     provider: cli
#   openrouter-cloud:
#     provider: openrouter
#     num_ctx: 262144
#     capabilities: [tool-call, long-context]
#     sampling: { max_tokens: 16384 }

# -------------------------------------------------------------------
# Optional: extra directories the Model Manager scans for GGUF files.
# With no `model_dirs` Forge scans NOTHING, and the "add a model" browser comes
# up empty even when the drive is full of GGUFs. Sibling `mmproj-*.gguf` files
# found next to a model are auto-suggested as its `mmproj_path`.
# -------------------------------------------------------------------
# model_dirs:
#   - D:/models
#   - /home/me/gguf

# -------------------------------------------------------------------
# Optional: a short instruction appended to every system prompt, for things
# true of this workspace regardless of model. Per-repo guidance belongs in
# FORGE.md instead — Forge injects that automatically.
# -------------------------------------------------------------------
# custom_instructions: >-
#   Prefer the repository's existing patterns over introducing new dependencies.

# Optional: 'trace' | 'debug' | 'info' | 'warn' | 'error'. Raise this before
# reporting a bug — the Forge output channel is the only record of a failed
# spawn or a rejected request.
# log_level: info

# -------------------------------------------------------------------
# Models — array form. `name` is the id shown in the picker.
# -------------------------------------------------------------------
models:

  # --- GGUF / direct llama-server ---
  - name: my-model
    gguf_path: /path/to/model.gguf
    mmproj_path: /path/to/mmproj-F16.gguf   # optional → enables vision
    spawn:
      num_ctx: 32768
      n_parallel: 4
      n_batch: 512
      type_k: q8_0
      type_v: q8_0
      flash_attn: true
      n_gpu_layers: 999                # every layer on GPU; -1 is auto-fit, see above
      # extra_llama_server_args: ["--reasoning-budget", "4096"]
    # Rare spawn-time overrides (force a respawn when selected, e.g. via tools):
    # spawn_profiles:
    #   long-context: { num_ctx: 131072, n_parallel: 1 }
    sampling:
      top_k: 64
      stop: "<end_of_turn>"          # gemma stop token (qwen/ChatML use <|im_end|>)

  # Need the SAME GGUF launched two different ways (e.g. one server with
  # reasoning on for the agent, one with `--reasoning off` for headless workers)?
  # Don't reach for spawn_profiles — just add a SECOND model entry with the same
  # gguf_path and the different launch args. Two entries = two independent
  # llama-server slots / holds / pool keys with zero special-casing; dispatch the
  # name you want. (A trailing @profile is request-time ONLY and never changes
  # the launch command, so it can't flip a spawn flag like --reasoning.)
  # - name: my-model-worker
  #   gguf_path: /path/to/model.gguf        # same file as my-model
  #   think: false
  #   spawn:
  #     extra_llama_server_args: ["--reasoning", "off"]

  # --- Ollama (local daemon) ---
  # For concurrent same-model workers on Ollama, set the daemon env var
  # OLLAMA_NUM_PARALLEL=4 (configured on the daemon, not here in Forge).
  # - name: "gemma4:26b"
  #   provider: ollama
  #   endpoint: http://127.0.0.1:11434
  #   num_ctx: 262144
  #   think: true
  #   reasoning_effort: medium
  #   sampling: { max_tokens: 131072 }

  # --- Ollama cloud (routed through local daemon; auth via `ollama auth login`) ---
  # - name: "deepseek-v4-flash:cloud"
  #   provider: ollama
  #   endpoint: http://127.0.0.1:11434
  #   num_ctx: 1000000
  #   think: true
  #   sampling: { max_tokens: 65536 }

  # --- Cloud OpenAI-compatible providers (key in SecretStorage) ---
  # Set the token with: Command Palette -> Forge: Set Cloud Provider Token
  # - name: grok-4.3
  #   provider: xai                  # xai | openrouter | openai | openai-compatible
  #   api_key_secret: xai
  #   capabilities: [tool-call]
  #   num_ctx: 1000000
  #   sampling: { temperature: 0.7, max_tokens: 30000 }
  # --- External CLI agents via existing subscriptions (no API key in Forge) ---
  # Forge spawns the already-logged-in CLI locally; auth is entirely the CLI's
  # own login (`claude login` / `codex login`), never a key in config.yaml.
  # These are FULL-RIGHTS external agents using their OWN tools. They can be
  # selected for direct sidebar chat and used as ask_local_agent targets.
  # - name: claude-code
  #   provider: cli
  #   cli: claude          # bare name resolved on PATH, or an absolute path
  #   cli_model: opus      # optional explicit override; omit to use the CLI's configured/default model
  #   group: external-agents
  # - name: codex
  #   provider: cli
  #   cli: codex

# -------------------------------------------------------------------
# Optional: web search (Tavily or Brave)
# Store the key with: Command Palette → Forge: Set Search API Key
# -------------------------------------------------------------------
# search:
#   provider: tavily
#   secret_key_name: forge.tavily.apiKey
#   max_results: 5

# -------------------------------------------------------------------
# Tool permissions. Once this block is present, these switches are
# authoritative for both tool advertising and dispatch.
#
# These switches hand real capability to an agent that will sometimes be wrong.
# `fs.delete`, `exec.*` and `git.write` let it delete files, run commands and
# change history. Forge gates and checkpoints them, but the software is provided
# AS IS with no warranty — see "Responsibility and Risk" in the README.
#
# ALL-OR-NOTHING: naming ANY group makes the schema defaults authoritative for
# EVERY group, not just the one you named. Omit `net:` here and web_search and
# web_fetch are denied — the tools are not advertised to the model at all, and
# it will report that it has no web search, whether or not you stored an API
# key. Forge warns at startup naming any capability that went off this way.
# An explicit `false` (as below) is a decision and is never warned about.
#
# `net.search: true` is necessary but NOT sufficient: web_search is only
# registered when a `search:` block exists too (see above).
# -------------------------------------------------------------------
permissions:
  fs: { read: true, write: true, delete: false }
  net: { search: false, fetch: false }
  exec: { terminal: false, headless: false }
  git: { read: true, write: false }
  agents:
    delegate: false       # set true to expose delegation tools

# Native local delegation is advisory and read-only: the secondary model can
# analyze supplied context but receives no tools and cannot edit or execute.
# To consult two different direct llama.cpp models, set this to at least 2;
# slots prevent eviction but do not guarantee sufficient RAM/VRAM.
# max_simultaneous_models: 2

# Warm direct-chat Claude/Codex process limits. Worker and delegation CLI runs
# remain one-shot and do not consume these slots.
# max_cli_agents: 4
# cli_idle_timeout_ms: 900000

# -------------------------------------------------------------------
# Optional: external MCP stdio servers — their tools are bridged into the
# Forge tool registry on activation, after the config has loaded. Unlisted MCP
# tools default to `read`; classify sensitive tools explicitly. A slow or
# missing server binary never blocks Forge startup.
# -------------------------------------------------------------------
# mcp_servers:
#   - name: forgerelay
#     command: C:/path/to/forgerelay-mcp.exe
#     tool_permissions:
#       dispatch_subagent: delegate  # requires permissions.agents.delegate: true
#     max_result_chars: 24000   # truncate oversized tool results (default 24000)

# -------------------------------------------------------------------
# Optional: local semantic code search
# Requires a second local GGUF embedding model served by llama.cpp
# Forge starts it lazily on the first semantic search or /reindex, keeps it
# warm during active indexing/search, asks before a cold start, and unloads it
# after the configured idle timeout. It stops when the window deactivates too.
# Each workspace keeps its own persisted index at .forge/embeddings.index.json.
# -------------------------------------------------------------------
# embeddings:
#   enabled: true
#   model_path: /path/to/embedding-model.gguf
#   port: 8091
#   # Embedding model's context window (default 2048). Also pins llama-server's
#   # --batch-size/--ubatch-size: an embedding input cannot be split across
#   # physical batches, so this must exceed your largest chunk or requests fail
#   # with HTTP 500 "input is too large to process".
#   n_ctx: 2048
#   # Task prefixes for documents and queries. `gemma` is correct ONLY for
#   # EmbeddingGemma (measured on a 2679-chunk index: MRR 0.384 -> 0.634); it
#   # would corrupt nomic-embed/bge results. Default `none`. Changing this
#   # invalidates the stored index and forces a rebuild.
#   prompt_style: gemma
#   auto_index_on_search: true
#   # Show an Accept/Cancel warning before starting the server from a cold state.
#   confirm_on_start: true
#   # Forge-owned server is stopped after this long without indexing/search use.
#   idle_timeout_ms: 120000
#   max_file_size_kb: 256
#   # Anchored at the WORKSPACE ROOT, like every other glob Forge takes. In a
#   # workspace holding several projects, "src/**" matches only a top-level
#   # src/ — it will not reach subproject/src/**, and the index comes out
#   # nearly empty while looking like it built fine. Omit this key to index
#   # everything (**/*), or list each project: ["app/src/**", "lib/src/**"].
#   include_globs: ["src/**", "test/**"]
#   exclude_globs: ["**/node_modules/**", "**/dist/**", "**/.git/**"]

# -------------------------------------------------------------------
# view_video — frame extraction (optional)
# -------------------------------------------------------------------
# The agent's `view_video` tool samples still frames across a short clip with
# ffmpeg and sends them as images. It requires ffmpeg AND ffprobe; without them
# the tool fails with a message naming the install command. It does not send
# audio, and it does not send motion — only the sampled stills.
#
# frame_max_dimension is a CONTEXT knob before it is a quality one. Measured on
# a 5 s clip, prompt tokens for the whole request:
#
#   1920x1088 unscaled   Qwen3.8-27B   22,501   (rejected outright at 16k ctx)
#   1920x1088 unscaled   Gemma 4 12B    5,363
#   640 px               Qwen3.8-27B    2,479
#   384 px               Qwen3.8-27B      983
#
# If a clip is rejected for exceeding the context, lower this before anything
# else. Settings are global — tools are registered once at activation, so these
# cannot be overridden per model or per group.
# -------------------------------------------------------------------
# video:
#   # Clips longer than this are refused before any frame is decoded.
#   max_duration_seconds: 30
#   # Hard cap on frames per call. The model's own max_frames argument may only
#   # lower this, never raise it. Actual count scales with clip length
#   # (roughly one frame per 5 s, minimum 3).
#   max_frames: 8
#   # Longest edge of each frame, in pixels. See the table above.
#   frame_max_dimension: 640
#   # ffmpeg -q:v. 2 is best quality, higher is smaller. 2..31.
#   frame_quality: 3
#   # Explicit ffmpeg executable. Omit to resolve from PATH, then (on Windows)
#   # the WinGet package tree. ffprobe must sit beside it.
#   ffmpeg_path: ""
