<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#ffffff"/>
  <!-- Frame -->
  <rect x="4" y="4" width="120" height="120" rx="16" fill="none" stroke="#111111" stroke-width="6"/>

  <!-- Chip body -->
  <rect x="32" y="32" width="64" height="64" rx="6" fill="#111111" stroke="#111111" stroke-width="2"/>

  <!-- Pins — top -->
  <rect x="40" y="20" width="6" height="14" rx="2" fill="#111111"/>
  <rect x="54" y="20" width="6" height="14" rx="2" fill="#111111"/>
  <rect x="68" y="20" width="6" height="14" rx="2" fill="#111111"/>
  <rect x="82" y="20" width="6" height="14" rx="2" fill="#111111"/>

  <!-- Pins — bottom -->
  <rect x="40" y="94" width="6" height="14" rx="2" fill="#111111"/>
  <rect x="54" y="94" width="6" height="14" rx="2" fill="#111111"/>
  <rect x="68" y="94" width="6" height="14" rx="2" fill="#111111"/>
  <rect x="82" y="94" width="6" height="14" rx="2" fill="#111111"/>

  <!-- Pins — left -->
  <rect x="20" y="40" width="14" height="6" rx="2" fill="#111111"/>
  <rect x="20" y="54" width="14" height="6" rx="2" fill="#111111"/>
  <rect x="20" y="68" width="14" height="6" rx="2" fill="#111111"/>
  <rect x="20" y="82" width="14" height="6" rx="2" fill="#111111"/>

  <!-- Pins — right -->
  <rect x="94" y="40" width="14" height="6" rx="2" fill="#111111"/>
  <rect x="94" y="54" width="14" height="6" rx="2" fill="#111111"/>
  <rect x="94" y="68" width="14" height="6" rx="2" fill="#111111"/>
  <rect x="94" y="82" width="14" height="6" rx="2" fill="#111111"/>

  <!-- Corner notch -->
  <circle cx="38" cy="38" r="4" fill="#ffffff"/>

  <!-- Pixel-art ? (5×7 grid, 7px pitch, 6×6 px blocks, silver) -->
  <!-- Row 0: . X X X . -->
  <rect x="54" y="40" width="6" height="6" fill="#a8a8a8"/>
  <rect x="61" y="40" width="6" height="6" fill="#a8a8a8"/>
  <rect x="68" y="40" width="6" height="6" fill="#a8a8a8"/>
  <!-- Row 1: X . . . X -->
  <rect x="47" y="47" width="6" height="6" fill="#a8a8a8"/>
  <rect x="75" y="47" width="6" height="6" fill="#a8a8a8"/>
  <!-- Row 2: . . . . X -->
  <rect x="75" y="54" width="6" height="6" fill="#a8a8a8"/>
  <!-- Row 3: . . X X . -->
  <rect x="61" y="61" width="6" height="6" fill="#a8a8a8"/>
  <rect x="68" y="61" width="6" height="6" fill="#a8a8a8"/>
  <!-- Row 4: . . X . . -->
  <rect x="61" y="68" width="6" height="6" fill="#a8a8a8"/>
  <!-- Row 5: (gap) -->
  <!-- Row 6: . . X . . -->
  <rect x="61" y="82" width="6" height="6" fill="#a8a8a8"/>
</svg>
