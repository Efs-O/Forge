# Bridge YAML for local testing (paths on this machine).
#
# Run:
#   continue-llamacpp-bridge config/bridge.yaml
#
# Continue: apiBase http://127.0.0.1:9099/v1, apiKey = api_key below,
# model id = one of the keys under models: (must match ~/.continue/config.yaml).

api_key: "continue-local-change-me"
bind_host: "127.0.0.1"
bind_port: 9099
# When true (default per model or here), strip channel/thought markup only if that model has think: false.
# Models with think: true are never stripped. Per-model strip_thinking_channels: false disables stripping.
strip_thinking_channels: true

# Number of llama-server processes to keep alive simultaneously.
# Each slot claims an incremental port (8080, 8081, …).
# Requires enough VRAM/RAM for all loaded models. Default: 1 (current behaviour).
max_simultaneous_models: 4

llama_server:
  binary: "C:/Program Files (x86)/Llamacpp/llama.cpp-b8929/llama-server.exe"
  host: "127.0.0.1"
  port: 8080
  n_gpu_layers: -1
  n_batch: 512
  n_parallel: 1
  type_k: 8
  type_v: 8
  default_num_ctx: 4096
  flash_attn_default: true

models:
  # Keys must match the client "model" id (Continue,etc.).
  gemma4-e4b-it-ud-q4kxl:
    gguf_path: "N:/GEMMA GGUF UNSLOTH/E4B/gemma-4-E4B-it-UD-Q4_K_XL.gguf"
    mmproj_path: "N:/GEMMA GGUF UNSLOTH/E4B/mmproj-F16.gguf"
    num_ctx: 98304
    n_batch: 512
    flash_attn: true
    think: true
    system_prompt: |
      You are Forge, a local AI coding assistant running inside VS Code.
      You have tools available: read_file, write_file, replace_in_file, list_directory, search_code, run_terminal, git_status, git_diff, and more.
      ALWAYS use tools to accomplish tasks. Never describe what you would do — do it by calling the tools directly.
      When the user asks you to read, audit, or investigate files, call read_file immediately. Do not summarize what you plan to do.
      After each tool result, continue calling tools until the task is complete, then give a short summary.
    strip_tools: false
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 64
      min_p: 0.0
      seed: 0
      presence_penalty: 0.0
      repetition_penalty: 1.0
      repeat_last_n: 64
      stop: "<|im_end|>"
      max_tokens: 98304

  gemma4-26b-a4b-it-iq3s:
    gguf_path: "N:/GEMMA GGUF UNSLOTH/26B/gemma-4-26B-A4B-it-UD-IQ3_S.gguf"
    mmproj_path: "N:/GEMMA GGUF UNSLOTH/26B/mmproj-F16.gguf"
    num_ctx: 98304
    n_batch: 512
    flash_attn: true
    think: true
    system_prompt: |
