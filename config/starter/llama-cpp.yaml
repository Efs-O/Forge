# Forge starter config — llama.cpp
# Replace the two marked paths, then run "Forge: Validate Config".

active_model: local-model

llama_server:
  binary: /REPLACE/WITH/PATH/TO/llama-server

models:
  - name: local-model
    provider: llama.cpp
    gguf_path: /REPLACE/WITH/PATH/TO/model.gguf
    spawn:
      num_ctx: 32768
      # Every layer on GPU. NOT -1 — on llama.cpp b10430+ that means auto-fit,
      # which quietly leaves part of the model on the CPU.
      n_gpu_layers: 999
      flash_attn: true
      extra_llama_server_args:
        # How much of the prompt is re-evaluated when an edit lands mid-prompt.
        # llama.cpp can only rewind cached state to a checkpoint, and its default
        # spacing (8192) is coarser than a chat edit — measured 7272 re-evaluated
        # tokens vs 32 at 1024, for no extra VRAM. Safe to delete if unsupported
        # by your llama.cpp build.
        - "--checkpoint-min-step"
        - "1024"

permissions:
  # A coding agent needs to run builds and tests. Every write, delete, command
  # and git action still asks for confirmation unless /clanker is on. Each new
  # browser origin is approved once per session; desktop control of VS Code
  # itself stays off. Search needs a key, so it stays off.
  fs: { read: true, write: true, delete: true }
  net: { search: false, fetch: true }
  exec: { headless: true }
  git: { read: true, write: true }
  agents: { delegate: true }
  browser: { enabled: true }
  desktop: { enabled: true }

# Local agents (Claude Code, Codex) can message this chat over the agent bus.
# Remote control needs a transport (Telegram or WhatsApp) before it does
# anything; scheduled jobs are inert until you define one.
control_server:
  enabled: true
agent_bus:
  enabled: true
remote:
  enabled: true
jobs:
  enabled: true
  allow_cli_agents: true

# The tested agent setup. Auto-compaction and the auto-created FORGE.md are
# off unless named here. max_tokens is a ceiling: each request is clamped to
# the room the context leaves.
forge_instructions:
  auto_create: true

auto_compact:
  enabled: true
  at: 0.85
  resume: true

defaults:
  sampling: { temperature: 0.6, top_p: 0.95, max_tokens: 200000 }
