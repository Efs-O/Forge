  - name: qwen38-flashnext-ud-q3kxl-mtp-no-vision
    gguf_path: "xxxx/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf"
    think: true
    reasoning_effort: low
    spawn:
      num_ctx: 65000
      n_parallel: 1
      # MoE, 48 layers: all layers on GPU; only early layers' experts stay in RAM.
      n_gpu_layers: 99
      n_batch : 8192
      type_k: q8_0
      type_v: q8_0
      flash_attn: true
      extra_llama_server_args:
        - "--device"
        - "CUDA0,CUDA1,CUDA2"
        - "--split-mode"
        - "layer"
        # Layer counts over 49 positions (48 + output), not VRAM ratios. Full layer
        # ~1.14 GB on GPU, experts-on-CPU layer ~0.1, layer 30 ~1.53. Measured
        # 2026-09-16: 15.52 / 15.42 / 11.52 GB, 9.47 t/s gen, 91.6 t/s prefill.
        # OOM or ~1 t/s mid-answer (WDDM paging) -> fallback 29,11,9 + n-cpu-moe 21.
        - "--tensor-split"
