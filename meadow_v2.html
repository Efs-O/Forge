<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enchanted Meadow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Setup ──────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, horizonY;
let t = 0;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    horizonY = H * 0.55;
    initScene();
}
window.addEventListener('resize', resize);

// ── Utility ────────────────────────────────────────────
function lerp(a, b, s) { return a + (b - a) * s; }
function rand(a, b) { return a + Math.random() * (b - a); }
function hexToRgb(h) {
    const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
    return [r,g,b];
}
function rgbStr(r,g,b) { return `rgb(${r|0},${g|0},${b|0})`; }
function brighten(hex, amt) {
    const [r,g,b] = hexToRgb(hex);
    return rgbStr(Math.min(255,r+amt), Math.min(255,g+amt), Math.min(255,b+amt));
}

// ── Sky & Sun ──────────────────────────────────────────
function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, horizonY);
    g.addColorStop(0, '#1e3a8a');
    g.addColorStop(0.3, '#3b82f6');
    g.addColorStop(0.6, '#7dd3fc');
    g.addColorStop(1, '#fef9c3');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizonY + 2);

    // Sun glow
    const sunX = W * 0.78, sunY = H * 0.18;
    const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 180);
    sg.addColorStop(0, 'rgba(255,250,200,0.9)');
    sg.addColorStop(0.15, 'rgba(255,240,150,0.5)');
    sg.addColorStop(0.5, 'rgba(255,220,100,0.1)');
    sg.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H);

    // Sun disc
    ctx.fillStyle = '#fffbe6';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 28, 0, Math.PI*2);
    ctx.fill();
}

// ── Clouds ─────────────────────────────────────────────
const clouds = [];
class Cloud {
    constructor() { this.spawn(true); }
    spawn(init) {
        this.x = init ? rand(0, W) : -rand(100, 300);
        this.y = rand(20, horizonY * 0.55);
        this.speed = rand(0.15, 0.45);
        this.opacity = rand(0.15, 0.45);
        this.puffs = [];
        const n = randInt(4, 7);
        for (let i = 0; i < n; i++) {
            this.puffs.push({
                ox: rand(-60, 60), oy: rand(-15, 15),
                r: rand(18, 45)
            });
        }
    }
    update() {
        this.x += this.speed;
        if (this.x > W + 200) this.spawn(false);
    }
    draw() {
        ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
        for (const p of this.puffs) {
            ctx.beginPath();
            ctx.arc(this.x + p.ox, this.y + p.oy, p.r, 0, Math.PI*2);
            ctx.fill();
        }
    }
}
function randInt(a,b) { return a + Math.floor(Math.random()*(b-a+1)); }

// ── Grass ──────────────────────────────────────────────
const grassLayers = [];
const LAYER_DEFS = [
    { count:350, scale:0.25, yBase:0.58, color:'#86efac', tipColor:'#bbf7d0', segH:35, segW:1.5 },
    { count:500, scale:0.55, yBase:0.68, color:'#4ade80', tipColor:'#86efac', segH:55, segW:2.5 },
    { count:600, scale:1.0,  yBase:0.82, color:'#15803d', tipColor:'#22c55e', segH:90, segW:4 },
    { count:300, scale:1.6,  yBase:1.0,  color:'#166534', tipColor:'#15803d', segH:130, segW:6 },
];

class GrassBlade {
    constructor(def) {
        this.x = rand(0, W);
        this.y = H * def.yBase + rand(-20, 20);
        this.h = def.segH * def.scale * rand(0.6, 1.4);
        this.w = def.segW * def.scale;
        this.color = def.color;
        this.tipColor = def.tipColor;
        this.phase = rand(0, Math.PI*2);
        this.freq = rand(0.8, 1.6);
        this.wavePhase = this.x / W;
    }
    draw(wind) {
        const globalWave = Math.sin(t * 0.7 + this.wavePhase * Math.PI * 4) * 0.12;
        const localSway = Math.sin(t * this.freq + this.phase) * 0.08;
        const tipAngle = globalWave + localSway + wind * 0.15;

        ctx.save();
        ctx.translate(this.x, this.y);

        const grad = ctx.createLinearGradient(0, 0, Math.sin(tipAngle)*this.h*0.3, -this.h);
        grad.addColorStop(0, this.color);
        grad.addColorStop(1, this.tipColor);
        ctx.fillStyle = grad;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        const midX = Math.sin(tipAngle * 0.5) * this.h * 0.15;
        const midY = -this.h * 0.5;
        const tipX = Math.sin(tipAngle) * this.h * 0.3;
        const tipY = -this.h;
        ctx.quadraticCurveTo(this.w * 0.8, midY * 0.5, midX, midY);
        ctx.quadraticCurveTo(tipX + this.w * 0.3, (midY+tipY)*0.5, tipX, tipY);
        ctx.quadraticCurveTo(-this.w*0.3, (midY+tipY)*0.5, midX, midY);
        ctx.quadraticCurveTo(-this.w*0.8, midY*0.5, 0, 0);
        ctx.fill();

        // Sunlight highlight
        const hl = Math.sin(t * 1.1 + this.wavePhase * 6) * 0.15 + 0.15;
        if (hl > 0.1) {
            ctx.globalAlpha = hl;
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(this.w*0.3, midY*0.5, midX, midY);
            ctx.quadraticCurveTo(tipX*0.6, (midY+tipY)*0.5, tipX*0.5, tipY);
            ctx.quadraticCurveTo(0, (midY+tipY)*0.5, 0, 0);
            ctx.fill();
        }

        ctx.restore();
    }
}

// ── Flowers ────────────────────────────────────────────
const flowers = [];
const FLOWER_TYPES = ['poppy', 'daisy', 'lavender', 'bluebell', 'cornflower'];

class Flower {
    constructor() {
        this.x = rand(0, W);
        this.y = rand(H*0.6, H);
        this.type = FLOWER_TYPES[randInt(0, FLOWER_TYPES.length-1)];
        this.scale = rand(0.6, 1.3);
        this.phase = rand(0, Math.PI*2);
        this.stemH = rand(20, 50);
    }
    draw(wind) {
        const sway = Math.sin(t*0.9 + this.phase) * 0.06 + wind * 0.04;
        const tipX = Math.sin(sway) * this.stemH * 0.3;
        const tipY = -this.stemH;

        ctx.save();
        ctx.translate(this.x, this.y);

        // Stem
        ctx.strokeStyle = '#166534';
        ctx.lineWidth = 1.5 * this.scale;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(sway * this.stemH * 0.15, tipY*0.5, tipX, tipY);
        ctx.stroke();

        // Flower head
        const cx = tipX, cy = tipY;
        if (this.type === 'poppy') this.drawPoppy(cx, cy);
        else if (this.type === 'daisy') this.drawDaisy(cx, cy);
        else if (this.type === 'lavender') this.drawLavender(cx, cy);
        else if (this.type === 'bluebell') this.drawBluebell(cx, cy);
        else this.drawCornflower(cx, cy);

        ctx.restore();
    }
    drawPoppy(cx, cy) {
        const r = 5 * this.scale;
        ctx.fillStyle = '#dc2626';
        for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(i * Math.PI/2 + 0.2);
            ctx.beginPath();
            ctx.ellipse(0, -r*0.6, r*0.7, r, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(cx, cy, r*0.35, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(cx, cy, r*0.2, 0, Math.PI*2);
        ctx.fill();
    }
    drawDaisy(cx, cy) {
        const r = 4 * this.scale;
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 8; i++) {
            const a = (i/8)*Math.PI*2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(a);
            ctx.beginPath();
            ctx.ellipse(0, -r*1.2, r*0.4, r*0.9, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(cx, cy, r*0.5, 0, Math.PI*2);
        ctx.fill();
    }
    drawLavender(cx, cy) {
        ctx.fillStyle = '#7c3aed';
        for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.ellipse(cx, cy - i*2.5*this.scale, 2*this.scale, 3*this.scale, 0, 0, Math.PI*2);
            ctx.fill();
        }
    }
    drawBluebell(cx, cy) {
        ctx.fillStyle = '#4f46e5';
        ctx.beginPath();
        ctx.ellipse(cx, cy - 3*this.scale, 3.5*this.scale, 5*this.scale, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#818cf8';
        ctx.beginPath();
        ctx.ellipse(cx, cy - 3*this.scale, 2*this.scale, 3*this.scale, 0, 0, Math.PI*2);
        ctx.fill();
    }
    drawCornflower(cx, cy) {
        const r = 4 * this.scale;
        ctx.fillStyle = '#2563eb';
        for (let i = 0; i < 5; i++) {
            const a = (i/5)*Math.PI*2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(a);
            ctx.beginPath();
            ctx.ellipse(0, -r*0.8, r*0.5, r*0.7, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        ctx.fillStyle = '#93c5fd';
        ctx.beginPath();
        ctx.arc(cx, cy, r*0.35, 0, Math.PI*2);
        ctx.fill();
    }
}

// ── Butterflies & Dragonflies ─────────────────────────
const insects = [];
class Butterfly {
    constructor() { this.reset(); }
    reset() {
        this.x = rand(0, W);
        this.y = rand(H*0.25, H*0.75);
        this.targetX = rand(0, W);
        this.targetY = rand(H*0.25, H*0.75);
        this.hue = rand(0, 360);
        this.size = rand(4, 7);
        this.wingPhase = rand(0, Math.PI*2);
        this.speed = rand(0.5, 1.5);
        this.retargetTimer = randInt(60, 200);
    }
    update() {
        this.wingPhase += 0.3;
        const wingOpen = Math.sin(this.wingPhase) * 0.7 + 0.3;

        // Move toward target
        const dx = this.targetX - this.x, dy = this.targetY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 2) {
            this.x += (dx/dist) * this.speed + Math.sin(t*2 + this.wingPhase) * 0.3;
            this.y += (dy/dist) * this.speed + Math.cos(t*1.5 + this.wingPhase) * 0.2;
        }

        this.retargetTimer--;
        if (this.retargetTimer <= 0) {
            this.targetX = rand(0, W);
            this.targetY = rand(H*0.25, H*0.75);
            this.retargetTimer = randInt(60, 200);
        }
        if (this.x < -50 || this.x > W+50 || this.y < -50 || this.y > H+50) this.reset();

        this.draw(wingOpen);
    }
    draw(wingOpen) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const col = `hsl(${this.hue},80%,55%)`;
        const col2 = `hsl(${this.hue+30},70%,45%)`;

        // Left wing
        ctx.save();
        ctx.scale(-wingOpen, 1);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size*0.5, -this.size*1.2, -this.size*1.5, -this.size*1.5, -this.size*1.2, -this.size*0.3);
        ctx.bezierCurveTo(-this.size*1.0, this.size*0.5, -this.size*0.5, this.size*0.3, 0, 0);
        ctx.fill();
        ctx.fillStyle = col2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size*0.3, this.size*0.5, -this.size*0.8, this.size*0.8, -this.size*0.5, this.size*0.3);
        ctx.bezierCurveTo(-this.size*0.3, this.size*0.1, -this.size*0.1, 0, 0, 0);
        ctx.fill();
        ctx.restore();

        // Right wing
        ctx.save();
        ctx.scale(wingOpen, 1);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(this.size*0.5, -this.size*1.2, this.size*1.5, -this.size*1.5, this.size*1.2, -this.size*0.3);
        ctx.bezierCurveTo(this.size*1.0, this.size*0.5, this.size*0.5, this.size*0.3, 0, 0);
        ctx.fill();
        ctx.fillStyle = col2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(this.size*0.3, this.size*0.5, this.size*0.8, this.size*0.8, this.size*0.5, this.size*0.3);
        ctx.bezierCurveTo(this.size*0.3, this.size*0.1, this.size*0.1, 0, 0, 0);
        ctx.fill();
        ctx.restore();

        // Body
        ctx.fillStyle = '#292524';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size*0.12, this.size*0.5, 0, 0, Math.PI*2);
        ctx.fill();

        // Antennae
        ctx.strokeStyle = '#292524';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(0, -this.size*0.4);
        ctx.quadraticCurveTo(-this.size*0.3, -this.size*0.8, -this.size*0.4, -this.size*0.9);
        ctx.moveTo(0, -this.size*0.4);
        ctx.quadraticCurveTo(this.size*0.3, -this.size*0.8, this.size*0.4, -this.size*0.9);
        ctx.stroke();

        ctx.restore();
    }
}

class Dragonfly {
    constructor() { this.reset(); }
    reset() {
        this.x = rand(0, W);
        this.y = rand(H*0.15, H*0.6);
        this.vx = rand(-2, 2);
        this.vy = rand(-1, 1);
        this.size = rand(6, 10);
        this.hue = rand(100, 200);
        this.wingPhase = rand(0, Math.PI*2);
    }
    update() {
        this.wingPhase += 0.5;
        const wingOpen = Math.sin(this.wingPhase) * 0.4 + 0.6;

        this.x += this.vx + Math.sin(t*3)*0.3;
        this.y += this.vy + Math.cos(t*2)*0.2;

        if (Math.random() < 0.005) {
            this.vx = rand(-2, 2);
            this.vy = rand(-1, 1);
        }
        if (this.x < -50 || this.x > W+50 || this.y < -50 || this.y > H+50) this.reset();

        this.draw(wingOpen);
    }
    draw(wingOpen) {
        ctx.save();
        ctx.translate(this.x, this.y);
        const angle = Math.atan2(this.vy, this.vx);
        ctx.rotate(angle);

        // Body
        ctx.fillStyle = `hsl(${this.hue},60%,35%)`;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size*1.2, this.size*0.15, 0, 0, Math.PI*2);
        ctx.fill();

        // Tail
        ctx.strokeStyle = `hsl(${this.hue},50%,45%)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-this.size*1.2, 0);
        ctx.lineTo(-this.size*2.5, 0);
        ctx.stroke();

        // Wings
        const wCol = `hsla(${this.hue},30%,80%,0.5)`;
        ctx.fillStyle = wCol;
        // Top pair
        ctx.save();
        ctx.scale(1, wingOpen);
        ctx.beginPath();
        ctx.ellipse(this.size*0.3, -this.size*0.2, this.size*0.8, this.size*0.25, -0.2, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-this.size*0.3, -this.size*0.2, this.size*0.6, this.size*0.2, -0.1, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        // Bottom pair
        ctx.save();
        ctx.scale(1, -wingOpen);
        ctx.beginPath();
        ctx.ellipse(this.size*0.3, this.size*0.2, this.size*0.7, this.size*0.22, 0.2, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-this.size*0.3, this.size*0.2, this.size*0.5, this.size*0.18, 0.1, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
    }
}

// ── Sunlight Rays ──────────────────────────────────────
function drawSunlightRays() {
    const sunX = W * 0.78, sunY = H * 0.18;
    ctx.save();
    ctx.globalAlpha = 0.03;
    ctx.fillStyle = '#fef08a';
    for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 0.5 - Math.PI * 0.25 + Math.sin(t*0.3+i)*0.05;
        const spread = 0.04 + Math.sin(t*0.5+i*1.3)*0.01;
        ctx.beginPath();
        ctx.moveTo(sunX, sunY);
        ctx.lineTo(sunX + Math.cos(angle - spread) * H*2, sunY + Math.sin(angle - spread) * H*2);
        ctx.lineTo(sunX + Math.cos(angle + spread) * H*2, sunY + Math.sin(angle + spread) * H*2);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
}

// ── Ground Fill ────────────────────────────────────────
function drawGround() {
    const g = ctx.createLinearGradient(0, horizonY, 0, H);
    g.addColorStop(0, '#86efac');
    g.addColorStop(0.3, '#4ade80');
    g.addColorStop(0.7, '#22c55e');
    g.addColorStop(1, '#14532d');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizonY, W, H - horizonY);
}

// ── Distant Hill Silhouette ────────────────────────────
function drawHills() {
    ctx.fillStyle = 'rgba(74, 222, 128, 0.3)';
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    for (let x = 0; x <= W; x += 20) {
        const y = horizonY - Math.sin(x * 0.003) * 30 - Math.sin(x * 0.007 + 1) * 20 - Math.sin(x * 0.001 + 2) * 15;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, horizonY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 10);
    for (let x = 0; x <= W; x += 15) {
        const y = horizonY + 10 - Math.sin(x * 0.005 + 3) * 20 - Math.sin(x * 0.012) * 12;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, horizonY + 10);
    ctx.closePath();
    ctx.fill();
}

// ── Init Scene ─────────────────────────────────────────
function initScene() {
    clouds.length = 0;
    grassLayers.length = 0;
    flowers.length = 0;
    insects.length = 0;

    for (let i = 0; i < 6; i++) clouds.push(new Cloud());

    for (const def of LAYER_DEFS) {
        const layer = [];
        for (let i = 0; i < def.count; i++) layer.push(new GrassBlade(def));
        grassLayers.push(layer);
    }

    for (let i = 0; i < 120; i++) flowers.push(new Flower());
    flowers.sort((a, b) => a.y - b.y);

    for (let i = 0; i < 8; i++) insects.push(new Butterfly());
    for (let i = 0; i < 4; i++) insects.push(new Dragonfly());
}

// ── Main Loop ──────────────────────────────────────────
function animate() {
    t += 0.016;
    const wind = Math.sin(t * 0.4) * 0.3 + Math.sin(t * 0.17) * 0.2;

    ctx.clearRect(0, 0, W, H);

    drawSky();
    drawSunlightRays();

    for (const c of clouds) { c.update(); c.draw(); }

    drawHills();
    drawGround();

    // Grass layers back to front
    for (const layer of grassLayers) {
        for (const blade of layer) blade.draw(wind);
    }

    // Flowers
    for (const f of flowers) f.draw(wind);

    // Insects
    for (const ins of insects) ins.update();

    // Atmospheric haze at horizon
    const haze = ctx.createLinearGradient(0, horizonY - 30, 0, horizonY + 40);
    haze.addColorStop(0, 'rgba(254,249,195,0)');
    haze.addColorStop(0.5, 'rgba(254,249,195,0.08)');
    haze.addColorStop(1, 'rgba(254,249,195,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, horizonY - 30, W, 70);

    requestAnimationFrame(animate);
}

resize();
animate();
</script>
</body>
</html>
