name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (extension)
        run: npx tsc --noEmit

      - name: Type-check (webview)
        run: npx tsc -p webview-ui/tsconfig.json --noEmit

      - name: Tests
        run: npx vitest run

      - name: Release build + package
        run: npm run package
