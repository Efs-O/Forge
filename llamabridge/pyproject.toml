[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continue-llamacpp-bridge"
version = "1.0.0"
description = "Minimal OpenAI-compatible bridge between Continue and llama-server (GGUF)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LlamaBridge contributors" }]
keywords = ["continue", "llama.cpp", "llama-server", "gguf", "openai", "bridge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0.1",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "requests>=2.32.0",
]

[project.scripts]
continue-llamacpp-bridge = "continue_llamacpp_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
