# =============================================================================
# Forge — example configuration (a complete, working setup)
# =============================================================================
# QUICK START
#   1. Create <your-project>/.forge/ and copy this file there as config.yaml.
#   2. Replace every `xxxx/` with the real folder on your machine:
#        llama_server.binary, models[].gguf_path / mmproj_path / --model-draft,
#        and the optional tools (embeddings, voice, MCP servers, CLI agents).
#   3. Delete the model entries you do not have, and point `active_model` at
#      one you kept. Every `name` in `aliases` must still exist.
#   4. Reload the VS Code window.
#
# Forge never falls back silently: a wrong path is reported, not guessed.
# API keys are NEVER stored here — use "Forge: Set Cloud Provider Token"; this
# file only names the secret (`api_key_secret`).
# Compaction token counting defaults to `tokenize` for llama.cpp and `estimate`
# for other providers. `openai-compatible` may opt into `tokenize` or `count_tokens`;
# other providers may explicitly set `token_count: estimate`.
#
# Precedence — request time: defaults < group < model < profile.
#              spawn time:   group.spawn < model.spawn.
# The GPU layout below is 2x RTX 5060 Ti 16 GB (CUDA0/1) + RTX 3060 12 GB
# (CUDA2); re-tune `--device` / `--tensor-split` for your cards. An external
# drafter (--model-draft) must sit on the LAST --device.
# =============================================================================

# ===========================================================================
# A. CORE BEHAVIOR
# ===========================================================================

active_model: qwen38-27b-dflash2-ud-q6k-vision

log_level: debug

forge_instructions:
  auto_create: true

custom_instructions: >-
  Use the repository-specific FORGE.md injected by Forge. Keep it concise and update it only when the user explicitly asks to record durable project instructions.

# WARNING: FULL PERMISSIONS. A config that omits a key leaves it off. The setup
# wizard turns on file delete, headless commands, git writes, fetch, delegation,
# browser and desktop for a new install; this example also turns on the
# terminal and search, so the agent may delete files, run terminal and headless
# commands, write to git, delegate to other agents, and search/fetch the web.
# Writes, terminal and git actions still ask for confirmation — unless you turn
# that off with /clanker. Review this block before your first session and set
# anything you do not want to false (or delete the line).
permissions:
  # approval_timeout_minutes: 30 # Optional: stop waiting for unanswered approvals after 30 minutes.
  # Secret-path patterns added to the built-in defaults, and the escape hatch:
  # exact files something may still read despite them.
  # secret_paths: ["**/.env.production"]
  # secret_paths_allow: ["C:/path/to/project/.env.production"]
  fs:
    delete: true
  exec:
    headless: true
    terminal: true
  git:
    write: true
  agents:
    delegate: true
  # What a chat may do to other chats in this window. A new install gets these
  # off: `message_chat action=new` and `action=steer` are refused until you set
  # them true, because both start or interrupt work the owner did not ask for.
  # `view` is read-only and always on.
  chats:
    new_chat: false          # message_chat action=new (open a second chat)
    steer: false             # message_chat action=steer (interrupt a running turn)
    new_chats_per_hour: 2    # 1-6; raise it for a supervisor dispatching several workers
  net:
    search: true
    fetch: true
  # Browser and desktop control. The setup wizard turns both on for a new
  # install; a config that omits them leaves them off. Each new browser origin
  # still asks for approval once per session.
  browser:
    enabled: true
  desktop:
    enabled: true
    # Opt in to controlling the ordinary VS Code `code` process. Off by
    # default, and inert while `enabled` is false. Deliberately narrow: this
    # matches the `code`/`code.exe` PROCESS name only — never a window title,
    # never the Chrome_WidgetWin_1 class, and never a fork (Code - Insiders,
    # Cursor, Windsurf, VSCodium, devenv), which stay refused whatever you set
    # here. Every input into a VS Code window still asks for confirmation on
    # each call, so this alone cannot drive Forge's own chat. Turning it off
    # again drops the VS Code approval and its captures immediately; other
    # windows keep theirs.
    # allow_vscode: false

# Owner-only approval policy lives in `~/.forge/policy.yaml`, not config.yaml.
# approvals:

# Persistent agent jobs (docs/JOBS.md). The setup wizard turns the scheduler on
# for a new install; a config without a `jobs:` block has no scheduler. With no
# jobs defined it is inert.
jobs:
  enabled: true
  # Optional absolute workspace folder whose window schedules jobs and owns
  # the machine-wide wake task. Other windows can still manage jobs.
  # home_workspace: C:/path/to/Forge
  # Let an unattended job drive a CLI agent (Claude Code / Codex) on your own
  # subscription. The wizard turns this on; set false to require approval.
  allow_cli_agents: true
  # Hosts a job may fetch from.
  allowed_hosts:
    - api.github.com
    # Asset downloads start on github.com and 302 to a CDN; the host gate checks
    # every hop, and GitHub serves assets from BOTH of these CDNs depending on
    # the asset, so all four are required for llamacpp_update.
    - github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
  max_concurrent: 2
  # Optional local-GPU admission gate for agent_task jobs; hold files apply
  # even when this block is absent. GPU indices are nvidia-smi indices.
  # gpu_gate:
  #   gpus: [0, 1]
  #   max_util_percent: 1
  #   max_idle_vram_mb: 1024
  #   sample_seconds: 15

# ===========================================================================
# B. MODEL DEFINITIONS  (x_shared defines the &reasoning_budget_message anchor — must stay above models)
# ===========================================================================

x_shared:
  reasoning_budget_message: &reasoning_budget_message " Stop reasoning now. Do not repeat, reconsider, or restate conclusions already reached.
   If you have decided the next action, take it immediately. If one specific fact is missing, verify only that fact with the appropriate tool.
    Otherwise end reasoning and produce the answer or tool call now."

defaults:
  max_tool_rounds: 1000
  # Groups can be loaded on demand. Each eager group adds its tool schemas to
  # every request, increasing the prompt's prefill cost; `files` (structured
  # edits, move, restore) and `background` (stop/list/wait) are advertised
  # without loading, so listing them here changes nothing. The groups are files,
  # background, git (read/stage/commit/branch), code_intel (LSP actions and
  # semantic search), memory, agents (delegation, live sessions, jobs,
  # notifications), media (view, generate and upscale images, image search,
  # video stills, render HTML to a PNG, send a file), editor_ui, computer_use,
  # notebook, system, and halluscribe (history search). `media` is no longer
  # advertised by default: 53 sessions used four of its tools 0 times and a
  # fifth once, so every coding turn was paying about 2,300 tokens for it. List
  # it below to keep it eager.
  tool_groups:
    eager: []
  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 98304

profiles:
  main:
    think: true
    reasoning_effort: medium

aliases:
  gemma4-12b-it-ud-q5kxl: gemma4-12b-it-ud-q5kxl-vision
