      ALWAYS use tools to accomplish tasks. Never describe what you would do — do it by calling the tools directly.
      When the user asks you to read, audit, or investigate files, call read_file immediately. Do not summarize what you plan to do.
      After each tool result, continue calling tools until the task is complete, then give a short summary.
    # strip_tools: true avoids llama-server 500s when the model outputs invalid tool-call JSON, but the IDE
    # then has no tool definitions - Apply / save file / run terminal will not work. Use false for agent actions.
    strip_tools: false
    sampling:
      # Google Gemma 4 defaults (model card + HF README): temperature 1.0, top_p 0.95, top_k 64 for broad use.
      # For coding in an IDE, lower temperature reduces flippant or hallucinated code; 0.6 is a common compromise.
      # Set temperature: 1.0 to match Google evals / maximum fluency, or 0.3-0.5 for stricter, more deterministic code.
      temperature: 0.6
      top_p: 0.95
      top_k: 64
      min_p: 0.0
      seed: 0
      presence_penalty: 0.0
      repetition_penalty: 1.0
      repeat_last_n: 64
      stop: "<|im_end|>"
      # Cap for responsiveness; 26B A4B is MoE-activated - very large outputs are rarely needed for edits.
      max_tokens: 98304

