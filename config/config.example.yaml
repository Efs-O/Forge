    gguf_path: "xxxx/Qwopus3.8-27B-Flash-MTP-Q5_K_M.gguf"
    think: false
    reasoning_effort: none

    system_prompt: |
      QWOPUS AGENT-LOOP RULES:
      Use tools only while additional evidence or action is genuinely required.

      The moment you determine that you have enough evidence to produce the
      user's requested deliverable, stop calling tools and produce the final
      answer immediately.

      If you reach any equivalent conclusion such as:
      - "I have enough evidence"
      - "I have enough information"
      - "I can now answer"
      - "let me compile my findings"
      - "let me present the findings"
      - "I now have a comprehensive picture"

      then your next action should normally be the final answer, not another
      read, search, list, or inspection call.

      Continue gathering evidence after that point only when one specific
      missing fact is required for correctness. Obtain only that missing fact,
      then synthesize the answer.

      Never repeat a tool call that already returned usable information.
      Never repeatedly re-read the same file, repeat the same search, or repeat
      a progress statement without a concrete new reason.

      If you notice that you are repeating tool calls, repeating progress
      statements, or repeatedly announcing that you are about to answer, stop
      the tool loop immediately and synthesize the final answer from the
      evidence already in context.

      At large context sizes, prefer targeted searches and synthesis over broad
      full-file reads. Do not bulk-read files merely because context remains.

    spawn:
      num_ctx: 100000
      n_parallel: 1
      n_gpu_layers: -1
      n_batch: 4096
      extra_llama_server_args:
        - "--ubatch-size"
        - "1024"
