# Forge workspace config — F6 models-vs-profiles shape
#
# - models:   one entry per GGUF/endpoint, FACTS ONLY. Spawn-time facts for
#             llama.cpp live under `spawn:`. Vision is auto-derived from
#             `mmproj_path` (no `capabilities: [vision]` needed).
# - defaults: request-time fields shared by every model (system_prompt, sampling).
# - profiles: request-time role presets, selected via `active_model: name@profile`
#             (or `model@profile` over the control server / Relay).
# - aliases:  back-compat shim — old suffixed model names still resolve.
#
# Migrated from the pre-F6 layout (see config.yaml.bak). The old per-role clones
# (-coding / -vision / -worker) are gone: one loaded GGUF now serves every role.

active_model: gemma4-26b-a4b-it-iq3s@main

llama_server:
  binary: "N:/downloads/llama.cpp-b9402/llama-server.exe"
  host: "127.0.0.1"
  port: 8080

max_simultaneous_models: 2

control_server:
  enabled: true
  port: 8799

search:
  provider: tavily
  secret_key_name: forge.tavily.apiKey
  max_results: 5

# ---------------------------------------------------------------------------
# Request-time defaults — applied beneath each model's own fields and profile.
# ---------------------------------------------------------------------------
defaults:
  system_prompt: |
    You are Forge, a local AI coding assistant running inside VS Code.
    You have tools available: read_file, write_file, replace_in_file, list_directory, search_code, run_terminal, git_status, git_diff, and more.
    ALWAYS use tools to accomplish tasks. Never describe what you would do - do it by calling the tools directly.
    When the user asks you to read, audit, or investigate files, call read_file immediately. Do not summarize what you plan to do.
    After each tool result, continue calling tools until the task is complete, then give a short summary.
  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 98304

# ---------------------------------------------------------------------------
# Request-time role presets. Precedence: defaults < model fields < profile.
# ---------------------------------------------------------------------------
profiles:
  # Interactive coding driver (the old "-coding" role).
  main:
    think: true
    reasoning_effort: medium
  # Sub-coordinator: plans + delegates, still reasons.
  subcoordinator:
    think: true
    reasoning_effort: low
  # Headless fleet worker (the old "-worker" role): no reasoning, tight sampling.
  worker:
    think: false
    reasoning_effort: none
    sampling:
      temperature: 0.2

# ---------------------------------------------------------------------------
# Back-compat aliases: old suffixed name → base@profile. Remove once nothing
# dispatches by the old names. (vision is a capability now, not a role → @main.)
# ---------------------------------------------------------------------------
aliases:
  gemma4-26b-a4b-it-iq4xs: gemma4-26b-a4b-it-iq4xs-base@main
  gemma4-26b-a4b-it-iq4xs-coding: gemma4-26b-a4b-it-iq4xs-base@main
  gemma4-26b-a4b-it-iq4xs-vision: gemma4-26b-a4b-it-iq4xs-base@main
  gemma4-26b-a4b-it-iq4xs-worker: gemma4-26b-a4b-it-iq4xs-base@worker
  gemma4-12b-it-ud-q4kxl-coding: gemma4-12b-it-ud-q4kxl@main
  gemma4-12b-it-ud-q4kxl-vision: gemma4-12b-it-ud-q4kxl@main
  gemma4-12b-it-ud-q4kxl-worker: gemma4-12b-it-ud-q4kxl@worker
  qwen36-27b-q3km-coding: qwen36-27b-q3km@main
  qwen36-27b-q3km-worker: qwen36-27b-q3km@worker

