      enabled: false
      max_results: 5
      max_fetch_bytes: 100000
      timeout_ms: 15000

# Agent bus: turns on `ask_agent` **and** the `/agent/*` routes `forge.sh`
# uses (`src/config/agentBusSchema.ts:5-9`). Enabling it is what lets a Claude
# Code, Codex or Copilot session message this window at all; absent or disabled
# means neither exists.
agent_bus:
  enabled: true
  # CLI executables: a bare name on PATH or an absolute path.
  # claude_cli: claude
  # codex_cli: codex
  # copilot_cli: copilot
  # Pin one live session instead of letting Forge pick or start one per chat.
  # claude_session: my-session   # list them with Forge: Show Live Claude Sessions
  # codex_thread: <thread id>
  # Model and effort for the CLI sessions Forge starts. Unset = the CLI's own
  # config decides; `copilot_model` defaults to `auto` so a premium model is not
  # spent on every call.
  # codex_model: gpt-6-luna
  # codex_effort: high         # low | medium | high | xhigh | max
  # claude_model: opus
  # claude_effort: high
  # copilot_model: auto
  # How Forge reaches Claude Code: `pipe` is Forge's own stream-json pipe;
  # `relay` runs a billed `claude -p` per message instead, for a Claude Code
  # build that does not speak the pipe. `relay_model` is used only then.
  # claude_transport: pipe     # pipe | relay
  # relay_model: haiku         # the model the relay asks

# Linked agent delivery behavior. By default a linked session's panel is opened
# before each ask, then Forge waits briefly for its live adapter.
agent_links:
  open_panel: every_ask # every_ask | never
  panel_live_timeout_ms: 20000

# ===========================================================================
# Optional top-level blocks. Every one is commented: uncomment to use it, and
# a key the loader accepts but this example never names is a doc gap
# (test/unit/ConfigKeysDocumented.test.ts), so this list is the rest of them.
# ===========================================================================

# Extra folders the first-run wizard and the model picker scan for GGUF files.
# model_dirs:
#   - C:/models

# Absolute folders outside the workspace that delete_file and the file-writing
# tools may reach (read_file reads anywhere). Each entry must be an absolute path.
# extra_file_roots:
#   - C:/Users/you/tools

# Folder holding your own Nunjucks overrides of the built-in prompt templates.
# templates_dir: C:/Users/you/forge-templates

# Strip thinking and channel markers out of model responses. Default: on.
# A model's own `think` / `reasoning_effort` still decide what is expected.
# strip_thinking_channels: false

# Warm direct-chat CLI processes (Claude Code / Codex) to keep alive, and how
# long an idle one survives before it is disposed. Defaults: 4 and 900000 ms.
# max_cli_agents: 4
# cli_idle_timeout_ms: 900000

# Ollama daemon supervision: Forge starts `ollama serve` itself when a model's
# local Ollama endpoint refuses connection. Default: on.
# ollama:
#   auto_start: true
#   executable: ollama

# Let the agent set its own long-task check-in. `after_minutes` is 5-240 and
# `/checkin` writes this key; removing the block stops the note mid-task.
# elapsed_time_note: { after_minutes: 20 }

# Keep the exact agent-loop request bodies on disk for debugging. Off unless
# this block is present (max_mb 1-10000, keep_hours 1-720).
# record_requests: { enabled: true, max_mb: 200, keep_hours: 24 }

# Browser knobs that are not permissions. `channel` is used exactly as
# configured (no silent fallback); `headless` is a config value, never a model
# argument. Each new origin still asks for approval once per session.
# browser:
#   channel: chrome          # chrome | msedge | chromium
#   headless: false
#   allowed_origins: []

# Hosts `web_fetch` may GET: exact hostnames or `*.suffix` wildcards. Default
# is empty, so every host this chat has not approved asks once per chat. This
# is a different gate from `jobs.allowed_hosts` above (a job is refused
# outright), and a permanent exception is written here by you, never by an
# approval clicked in a chat.
# fetch:
#   allowed_hosts:
#     - api.github.com

# Command execution settings that are not permissions: the per-call timeout
# (default 30000 ms) and extra denylist patterns on top of the built-in one.
# exec:
#   timeout_ms: 30000
#   denylist_extra: []

# Tool-layer settings; absent means every tool behaves as it always has.
# `warn_at` must be lower than `max`, so a long file gets the "plan where to
# split" line instead of only the refusal.
# tools:
#   file_length_warning:
#     warn_at: 350
#     max: 500
#   # The "new problems after this edit" note a write result carries: the file's
#   # diagnostics are snapshotted before the write and only what the write
#   # introduced is named after it — errors and warnings, capped, with the count
#   # of what the cap left out. ON by default, the only `tools:` block that is:
#   # two seconds per edit was priced against the 271 `tsc`/`eslint` shell rounds
#   # in the audit window this replaces. `enabled: false` restores the results
#   # these tools produced before 2026-10-29.
#   edit_diagnostics:
#     enabled: true
#     settle_ms: 2000    # 0-15000; the ceiling on the wait, not a sleep — a
#                        # matching diagnostics event settles in 300 ms, and 0
#                        # reads once immediately after the write.
#     max_items: 10      # 1-50 problems named per result; the rest are counted

# Skills: folders of instructions plus tested scripts the model opens with
# `load_skill`. It finds them in three places, and a later one wins by name (the
# catalog line says which root a skill came from, and says so when it shadows
# another): the skills shipped in the VSIX, `~/.forge/skills/` for this PC, and
# `.forge/skills/` in the open workspace. A skill grants nothing — its scripts
# run through `shell` under the same approvals as any other command.
# Absent means OFF: one line per skill in the system prompt plus a `load_skill`
# schema on every round is the cost, so a workspace with no skills keeps the
# prompt it always had. Turn it on to get the catalog and the tool.
# skills:
#   enabled: false

# A laptop on your tailnet asks this machine to load a model it cannot start
# itself. Needs `tailscale serve --tcp <port>`, and `shared_ports` must mirror
# what the tailnet actually forwards or the laptop gets `port_not_shared`.
# Enabling it also requires `control_server.enabled: true`.
# model_starter:
#   enabled: false
#   port: 8798               # must match `tailscale serve --tcp 8798`
#   shared_ports: [8799]     # every port the laptop may reach
#   lease_ttl_s: 600         # 30-86400; how long a remote lease survives

# Desktop-side allowlist for laptop cloud requests; absent or disabled means no
# listener. `models` is required — name at least one model the laptop may use.
# cloud_relay:
#   enabled: false
#   port: 8797
#   max_body_mb: 32
#   models: [my-model]

# ── The two keys that came with the policy split ────────────────────────────
# `Forge: Move security settings to policy.yaml` moves these, plus permissions,
# llama_server, jobs, remote, mcp_servers and the rest of the policy keys, into
# `~/.forge/policy.yaml` — the owner's file, the one an agent cannot edit. Until
# that command has been run, both files accept these keys; the same key in both
# at once is a load error that names it, never a merge.
#
# An engine is a named set of facts about how a server process is started and
# stopped, plus which executable runs it. A model then says `engine: strata-8090`
# and nothing else about programs: a new model on an existing engine is a free
# edit, a new engine is an owner edit. Models that start the SAME program share
# one engine, so twenty llama.cpp models on one build become one engine plus
# twenty one-line edits instead of twenty copies of the same argv.
# engines:
#   strata-8090:
#     start_command: [python, N:/Strata/start_strata.py, --config, x.json, solo]
#     stop_command: [python, N:/Strata/stop_strata.py]
#     unload_path: /unload
#   llamacpp-b10430:
#     llama_server_binary: 'C:/Forge/llama.cpp-b10430/llama-server.exe'
# Hosts a config.yaml model `endpoint` may name besides loopback. A model that
# names a host not in this list fails to load once config.yaml opens to agents,
# because otherwise an agent could add a model that sends the chat anywhere.
# model_hosts: [100.64.0.10]
