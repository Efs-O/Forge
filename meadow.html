<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypnotic Meadow Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="meadowCanvas"></canvas>

    <script>
        // --- Configuration ---
        const CANVAS = document.getElementById('meadowCanvas');
        const CTX = CANVAS.getContext('2d');
        let W = window.innerWidth;
        let H = window.innerHeight;
        CANVAS.width = W;
        CANVAS.height = H;

        // --- Global State ---
        let time = 0;
        let globalWind = 0;
        let cloudSeed = [];
        let grassLayersData = [];
        let flowerLayersData = [];

        // --- Utility Functions ---

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function randFloat(min, max) {
            return Math.random() * (max - min) + min;
        }

        // --- Sky and Clouds ---

        function drawSky() {
            // 1. Sky Gradient (recreated each frame to match current canvas size)
            const skyGrad = CTX.createLinearGradient(0, 0, 0, H * 0.6);
            skyGrad.addColorStop(0, 'rgba(135, 206, 235, 1)'); // Light Cyan (Horizon)
            skyGrad.addColorStop(1, 'rgba(100, 149, 237, 1)'); // Cornflower Blue (Top)
            CTX.fillStyle = skyGrad;
            CTX.fillRect(0, 0, W, H * 0.6);

            // 2. Clouds (pre-generated positions, drifting slowly)
            for (const cloud of cloudSeed) {
                cloud.x += cloud.speed;
                if (cloud.x - cloud.size > W) cloud.x = -cloud.size; // wrap around

                CTX.save();
                CTX.translate(cloud.x, cloud.y);
                CTX.scale(1, 0.5); // Flatten the cloud
                CTX.beginPath();
                CTX.arc(0, 0, cloud.size * 0.6, 0, Math.PI * 2);
                CTX.arc(cloud.size * 0.3, 0, cloud.size * 0.5, 0, Math.PI * 2);
                CTX.arc(-cloud.size * 0.3, 0, cloud.size * 0.4, 0, Math.PI * 2);
                CTX.closePath();

                CTX.fillStyle = 'rgba(255, 255, 255, 0.7)';
                CTX.fill();
                CTX.restore();
            }
        }

        // --- Grass Simulation ---

        function getWaveDisplacement(x, y) {
            const wave1 = Math.sin((x * 0.01 + time * 0.001) * 1.5);
            const wave2 = Math.cos((y * 0.005 + time * 0.0008) * 1.2);
            let displacement = (wave1 * 0.5 + wave2 * 0.3) * Math.sin(x * 0.005 + time * 0.0003);
            displacement *= (1 + globalWind * 2);
            return displacement;
        }

        function drawGrassBlade(x, y, length, thickness, depthFactor, offset) {
            const baseGreen = 50 + (depthFactor * 50);
            const green = Math.min(150, baseGreen + 20);
            const blue = Math.min(100, 100 + 20);
            // Fixed color channel logic: green channel is the second value
            const color = `rgb(50, ${green}, ${blue})`;

            CTX.beginPath();
            CTX.moveTo(x, y);
            
            // Apply wave displacement to the curve
            const wave = getWaveDisplacement(x + offset, y) * 30;
            
            CTX.quadraticCurveTo(
                x + wave, 
                y + length * 0.5, 
                x + wave * 1.5, 
                y + length
            );

            CTX.strokeStyle = color;
            CTX.lineWidth = thickness * depthFactor;
            CTX.globalAlpha = 0.8 * depthFactor;
            CTX.stroke();
        }

        function drawGrassLayer(layerIndex) {
            const layer = grassLayersData[layerIndex];
            if (!layer) return;

            CTX.save();
            CTX.globalAlpha = Math.min(0.8, layer.depthFactor * 0.5);

            for (const blade of layer.blades) {
                drawGrassBlade(blade.x, blade.y, blade.length, blade.thickness, layer.depthFactor, blade.offset);
            }
            CTX.restore();
        }

        // --- Wildflowers ---

        function drawFlower(x, y, type, size, depthFactor) {
            CTX.save();
            CTX.translate(x, y);
            CTX.scale(depthFactor, depthFactor);
            CTX.globalAlpha = 0.8 * depthFactor;

            CTX.fillStyle = `rgba(34, 139, 34, ${0.5 * depthFactor})`;
            CTX.fillRect(0, 0, 1, size * 0.5);

            let color;
            let petals;
            
            switch(type) {
                case 'poppy':
                    color = `rgba(255, 0, 0, ${0.9 * depthFactor})`;
                    petals = 5;
                    break;
                case 'daisy':
                    color = `rgba(255, 255, 0, ${0.8 * depthFactor})`;
                    petals = 10;
                    break;
                case 'lavender':
                    color = `rgba(128, 0, 128, ${0.9 * depthFactor})`;
                    petals = 6;
                    break;
                default:
                    color = `rgba(100, 149, 237, ${0.9 * depthFactor})`;
                    petals = 8;
            }

            for (let i = 0; i < petals; i++) {
                const angle = (i / petals) * Math.PI * 2;
                const x_petal = Math.cos(angle) * size * 0.8;
                const y_petal = Math.sin(angle) * size * 0.8;
                
                CTX.fillStyle = color;
                CTX.beginPath();
                CTX.ellipse(x_petal, y_petal, size * 0.4, size * 0.6, angle, 0, Math.PI * 2);
                CTX.fill();
            }

            CTX.restore();
        }

        function drawFlowerLayer(layerIndex) {
            const layer = flowerLayersData[layerIndex];
            if (!layer) return;

            for (const flower of layer.flowers) {
                drawFlower(flower.x, flower.y, flower.type, flower.size, layer.depthFactor);
            }
        }

        // --- Fauna ---

        class Creature {
            constructor(startX, startY, type) {
                this.x = startX;
                this.y = startY;
                this.type = type;
                this.size = randFloat(10, 25);
                this.vx = randFloat(-1, 1);
                this.vy = randFloat(-1, 1);
                this.targetX = randFloat(0, W);
                this.targetY = randFloat(0, H * 0.8);
                this.wingAngle = 0;
                this.wingSpeed = randFloat(0.1, 0.3);
            }

            update() {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 50 || Math.random() < 0.005) {
                    this.targetX = randFloat(0, W);
                    this.targetY = randFloat(H * 0.2, H * 0.7);
                }

                this.vx = (dx / dist) * this.size * 0.01;
                this.vy = (dy / dist) * this.size * 0.01;

                this.x += this.vx;
                this.y += this.vy;

                this.wingAngle += this.wingSpeed;
                if (this.wingAngle > Math.PI * 2) this.wingAngle -= Math.PI * 2;
            }

            draw() {
                CTX.save();
                CTX.translate(this.x, this.y);
                
                if (this.type === 'butterfly') {
                    CTX.fillStyle = 'rgba(150, 150, 150, 0.8)';
                    CTX.beginPath();
                    CTX.arc(0, 0, this.size * 0.1, 0, Math.PI * 2);
                    CTX.fill();
                    
                    CTX.fillStyle = 'rgba(200, 100, 200, 0.7)';
                    CTX.rotate(Math.sin(this.wingAngle) * 0.5);
                    CTX.beginPath();
                    CTX.ellipse(0, 0, this.size * 0.6, this.size * 0.4, 0, 0, Math.PI * 2);
                    CTX.fill();
                    
                    CTX.rotate(-Math.PI);
                    CTX.beginPath();
                    CTX.ellipse(0, 0, this.size * 0.6, this.size * 0.4, 0, 0, Math.PI * 2);
                    CTX.fill();

                } else if (this.type === 'dragonfly') {
                    // Dragonfly body - Fixed height
                    CTX.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    CTX.fillRect(-this.size * 0.1, -this.size * 0.5, this.size * 0.2, this.size);
                    
                    CTX.fillStyle = 'rgba(100, 100, 255, 0.8)';
                    CTX.rotate(Math.sin(this.wingAngle) * 0.8);
                    CTX.beginPath();
                    CTX.ellipse(0, 0, this.size * 0.8, this.size * 0.3, 0, 0, Math.PI * 2);
                    CTX.fill();
                }
                CTX.restore();
            }
        }

        let creatures = [];

        function initializeCreatures() {
            creatures = [];
            for (let i = 0; i < 5; i++) {
                creatures.push(new Creature(randFloat(0, W), randFloat(0, H * 0.8), 'butterfly'));
            }
            for (let i = 0; i < 3; i++) {
                creatures.push(new Creature(randFloat(0, W), randFloat(0, H * 0.8), 'dragonfly'));
            }
        }

        function drawSunlight(time) {
            const gradient = CTX.createRadialGradient(W * 0.3, H * 0.3, 10, W * 0.3, H * 0.3, 300);
            gradient.addColorStop(0, 'rgba(255, 220, 150, 0.1)');
            gradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.05)');
            gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
            
            CTX.fillStyle = gradient;
            CTX.fillRect(0, 0, W, H);
        }

        // --- Initialization & Pre-generation ---

        function preGenerateScene() {
            // Clouds
            cloudSeed = [];
            for (let i = 0; i < 5; i++) {
                cloudSeed.push({
                    x: randFloat(0, W),
                    y: randFloat(0, H * 0.3),
                    size: randFloat(50, 150),
                    speed: randFloat(0.02, 0.08)
                });
            }

            // Grass Layers
            grassLayersData = [
                { depthFactor: 0.3, blades: [] }, // Layer 1
                { depthFactor: 0.6, blades: [] }, // Layer 2
                { depthFactor: 1.0, blades: [] }  // Layer 3
            ];

            const configs = [
                { startY: H * 0.6, endY: H * 0.8, count: 300, idx: 0 },
                { startY: H * 0.8, endY: H * 0.9, count: 500, idx: 1 },
                { startY: H * 0.9, endY: H, count: 800, idx: 2 }
            ];

            configs.forEach(cfg => {
                for (let i = 0; i < cfg.count; i++) {
                    grassLayersData[cfg.idx].blades.push({
                        x: randFloat(0, W),
                        y: randFloat(cfg.startY, cfg.endY),
                        length: randFloat(100, 250),
                        thickness: randFloat(0.5, 1.5),
                        offset: randFloat(-50, 50)
                    });
                }
            });

            // Flower Layers
            flowerLayersData = [
                { depthFactor: 0.5, flowers: [] }, // Layer 1
                { depthFactor: 0.8, flowers: [] }, // Layer 2
                { depthFactor: 1.0, flowers: [] }  // Layer 3
            ];

            const fConfigs = [
                { startY: H * 0.6, endY: H * 0.8, count: 200, idx: 0 },
                { startY: H * 0.8, endY: H * 0.9, count: 300, idx: 1 },
                { startY: H * 0.9, endY: H, count: 400, idx: 2 }
            ];

            fConfigs.forEach(cfg => {
                for (let i = 0; i < cfg.count; i++) {
                    flowerLayersData[cfg.idx].flowers.push({
                        x: randFloat(0, W),
                        y: randFloat(cfg.startY, cfg.endY),
                        type: ['poppy', 'daisy', 'lavender', 'bluebells', 'cornflowers'][randInt(0, 4)],
                        size: randFloat(30, 60)
                    });
                }
            });
        }

        function animate(timestamp) {
            time = timestamp;
            requestAnimationFrame(animate);

            CTX.clearRect(0, 0, W, H);
            drawSky();

            // Draw Grass
            drawGrassLayer(0);
            drawGrassLayer(1);
            drawGrassLayer(2);

            // Draw Flowers
            drawFlowerLayer(0);
            drawFlowerLayer(1);
            drawFlowerLayer(2);

            drawSunlight(time);

            creatures.forEach(creature => {
                creature.update();
                creature.draw();
            });
        }

        function init() {
            globalWind = 0.5; 
            preGenerateScene();
            initializeCreatures();
            animate(0);
        }

        window.addEventListener('resize', () => {
            W = window.innerWidth;
            H = window.innerHeight;
            CANVAS.width = W;
            CANVAS.height = H;
            preGenerateScene(); // Re-generate to fit new dimensions
        });

        init();
    </script>
</body>
</html>
