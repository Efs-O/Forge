# Forge config example — F6 models-vs-profiles shape
#
# Copy this file to <your-project>/.forge/config.yaml and edit.
# The setup wizard (first run) can also generate this file for you.
#
# All paths are absolute or relative to the workspace root.
# API keys are stored in VS Code SecretStorage — never put them here.
#
# THREE layers decide what a request looks like:
#   models:   one entry per GGUF/endpoint — FACTS ONLY. Spawn-time facts for
#             llama.cpp live under `spawn:`. Vision is auto-derived from
#             `mmproj_path` (no `capabilities: [vision]` needed).
#   defaults: request-time fields shared by every model (system_prompt, sampling).
#   profiles: request-time role presets, selected via `active_model: name@profile`.
#
# Merge precedence (request-time): defaults < model fields < profile.
# Spawn-time:                      model flat/spawn < spawn_profiles[<name>].

# Model to activate on startup. `name` or `name@profile` (profile optional).
active_model: my-model@main

# -------------------------------------------------------------------
# llama-server settings (direct GGUF mode)
# -------------------------------------------------------------------
llama_server:
  binary: /path/to/llama-server      # required for direct mode
  host: 127.0.0.1
  port: 8080
  n_gpu_layers: -1                   # -1 = all layers on GPU
  default_num_ctx: 32768             # fallback when a model omits num_ctx/spawn.num_ctx
  n_batch: 512
  n_parallel: 4                      # default concurrent worker slots
  type_k: q8_0                       # KV cache quantization
  type_v: q8_0
  flash_attn_default: true

# -------------------------------------------------------------------
# Request-time defaults — applied beneath each model's own fields and profile.
# -------------------------------------------------------------------
defaults:
  # NOTE: this is APPENDED beneath Forge's built-in template (execute.njk),
  # which already establishes the coding-agent persona and tool rules. To send
  # a prompt INSTEAD of the template — e.g. for a fine-tune that must not be
  # told it is Forge — set `system_prompt_mode: replace` on that model.
  # Caveat: `replace` also drops the template's fenced-JSON tool-call fallback,
  # so pair it with `strip_tools: true` or a natively tool-calling model.
  system_prompt: |
    You are Forge, a local AI coding assistant running inside VS Code.
    ALWAYS use tools to accomplish tasks. Never just describe what you would do.
    After each tool result, continue until the task is complete, then summarize.
  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 8192

# -------------------------------------------------------------------
# Request-time role presets. One loaded GGUF serves every role.
# -------------------------------------------------------------------
profiles:
  main:                              # interactive coding driver
    think: true
    reasoning_effort: medium
  subcoordinator:                    # plans + delegates
    think: true
    reasoning_effort: low
  worker:                            # headless fleet worker — no reasoning
    think: false
    reasoning_effort: none
    sampling:
      temperature: 0.2

# -------------------------------------------------------------------
# Optional back-compat aliases: old name -> base@profile.
# -------------------------------------------------------------------
# aliases:
#   my-model-worker: my-model@worker

# -------------------------------------------------------------------
# Control server (optional) — localhost API so an external orchestrator can
# load models on demand and discover the OpenAI-compatible endpoint.
#   GET /healthz  GET /models  POST /ensure {model}  POST /release {model}
#   POST /unload {model}  POST /chat {model, messages}   (model may be name@profile)
# -------------------------------------------------------------------
# control_server:
#   enabled: true
#   port: 8799

# -------------------------------------------------------------------
# Ollama daemon supervision (optional) — when a model's LOCAL Ollama endpoint
# refuses connection, Forge can start "ollama serve" itself. Remote endpoints
# are never auto-started.
# -------------------------------------------------------------------
# ollama:
#   auto_start: true                   # default: true
#   executable: C:\path\to\ollama.exe  # only for non-standard installs

# -------------------------------------------------------------------
# Models — array form. `name` is the id shown in the picker.
# -------------------------------------------------------------------
models:

  # --- GGUF / direct llama-server ---
  - name: my-model
    gguf_path: /path/to/model.gguf
    mmproj_path: /path/to/mmproj-F16.gguf   # optional → enables vision
    spawn:
      num_ctx: 32768
      n_parallel: 4
      n_batch: 512
      type_k: q8_0
      type_v: q8_0
      flash_attn: true
      n_gpu_layers: -1
      # extra_llama_server_args: ["--reasoning-budget", "4096"]
    # Rare spawn-time overrides (force a respawn when selected, e.g. via tools):
    # spawn_profiles:
    #   long-context: { num_ctx: 131072, n_parallel: 1 }
    sampling:
      top_k: 64
      stop: "<end_of_turn>"          # gemma stop token (qwen/ChatML use <|im_end|>)

  # Need the SAME GGUF launched two different ways (e.g. one server with
  # reasoning on for the agent, one with `--reasoning off` for headless workers)?
  # Don't reach for spawn_profiles — just add a SECOND model entry with the same
  # gguf_path and the different launch args. Two entries = two independent
  # llama-server slots / holds / pool keys with zero special-casing; dispatch the
  # name you want. (A trailing @profile is request-time ONLY and never changes
  # the launch command, so it can't flip a spawn flag like --reasoning.)
  # - name: my-model-worker
  #   gguf_path: /path/to/model.gguf        # same file as my-model
  #   think: false
  #   spawn:
  #     extra_llama_server_args: ["--reasoning", "off"]

  # --- Ollama (local daemon) ---
  # For concurrent same-model workers on Ollama, set the daemon env var
  # OLLAMA_NUM_PARALLEL=4 (configured on the daemon, not here in Forge).
  # - name: "gemma4:26b"
  #   provider: ollama
  #   endpoint: http://127.0.0.1:11434
  #   num_ctx: 262144
  #   think: true
  #   reasoning_effort: medium
  #   sampling: { max_tokens: 131072 }

  # --- Ollama cloud (routed through local daemon; auth via `ollama auth login`) ---
  # - name: "deepseek-v4-flash:cloud"
  #   provider: ollama
  #   endpoint: http://127.0.0.1:11434
  #   num_ctx: 1000000
  #   think: true
  #   sampling: { max_tokens: 65536 }

  # --- Cloud OpenAI-compatible providers (key in SecretStorage) ---
  # Set the token with: Command Palette -> Forge: Set Cloud Provider Token
  # - name: grok-4.3
  #   provider: xai                  # xai | openrouter | openai | openai-compatible
  #   api_key_secret: xai
  #   capabilities: [tool-call]
  #   num_ctx: 1000000
  #   sampling: { temperature: 0.7, max_tokens: 30000 }
  # --- External CLI agents via existing subscriptions (no API key in Forge) ---
  # Forge spawns the already-logged-in CLI locally; auth is entirely the CLI's
  # own login (`claude login` / `codex login`), never a key in config.yaml.
  # These are FULL-RIGHTS external agents using their OWN tools. They can be
  # selected for direct sidebar chat and used as dispatch_workers or
  # ask_local_agent targets.
  # - name: claude-code
  #   provider: cli
  #   cli: claude          # bare name resolved on PATH, or an absolute path
  #   cli_model: opus      # optional explicit override; omit to use the CLI's configured/default model
  #   group: external-agents
  # - name: codex
  #   provider: cli
  #   cli: codex

# -------------------------------------------------------------------
# Optional: web search (Tavily or Brave)
# Store the key with: Command Palette → Forge: Set Search API Key
# -------------------------------------------------------------------
# search:
#   provider: tavily
#   secret_key_name: forge.tavily.apiKey
#   max_results: 5

# -------------------------------------------------------------------
# Tool permissions. Once this block is present, these switches are
# authoritative for both tool advertising and dispatch.
# -------------------------------------------------------------------
permissions:
  fs: { read: true, write: true, delete: false }
  net: { search: false, fetch: false }
  exec: { terminal: false, headless: false }
  git: { read: true, write: false }
  agents:
    delegate: false       # set true to expose delegation tools
    cloud_workers: false  # explicit opt-in; cloud worker launches always require approval

# Native local delegation is advisory and read-only: the secondary model can
# analyze supplied context but receives no tools and cannot edit or execute.
# To consult two different direct llama.cpp models, set this to at least 2;
# slots prevent eviction but do not guarantee sufficient RAM/VRAM.
# max_simultaneous_models: 2

# Warm direct-chat Claude/Codex process limits. Worker and delegation CLI runs
# remain one-shot and do not consume these slots.
# max_cli_agents: 4
# cli_idle_timeout_ms: 900000

# -------------------------------------------------------------------
# Optional: external MCP stdio servers — their tools are bridged into the
# Forge tool registry on activation, after the config has loaded. Unlisted MCP
# tools default to `read`; classify sensitive tools explicitly. A slow or
# missing server binary never blocks Forge startup.
# -------------------------------------------------------------------
# mcp_servers:
#   - name: forgerelay
#     command: C:/path/to/forgerelay-mcp.exe
#     tool_permissions:
#       dispatch_subagent: delegate  # requires permissions.agents.delegate: true
#     max_result_chars: 24000   # truncate oversized tool results (default 24000)

# -------------------------------------------------------------------
# Optional: local semantic code search
# Requires a second local GGUF embedding model served by llama.cpp
# -------------------------------------------------------------------
# embeddings:
#   enabled: true
#   model_path: /path/to/embedding-model.gguf
#   port: 8091
#   # Embedding model's context window (default 2048). Also pins llama-server's
#   # --batch-size/--ubatch-size: an embedding input cannot be split across
#   # physical batches, so this must exceed your largest chunk or requests fail
#   # with HTTP 500 "input is too large to process".
#   n_ctx: 2048
#   # Task prefixes for documents and queries. `gemma` is correct ONLY for
#   # EmbeddingGemma (measured on a 2679-chunk index: MRR 0.384 -> 0.634); it
#   # would corrupt nomic-embed/bge results. Default `none`. Changing this
#   # invalidates the stored index and forces a rebuild.
#   prompt_style: gemma
#   auto_index_on_search: true
#   max_file_size_kb: 256
#   include_globs: ["src/**", "test/**"]
#   exclude_globs: ["**/node_modules/**", "**/dist/**", "**/.git/**"]
