name: Diagnose render preview

# Manual only. Runs the real-Chrome socket-wall test alone on windows-latest
# with Playwright's API trace, after printing the runner's Chrome version and
# how long the host takes to resolve `localhost` (preview's SSRF guard looks it
# up with no timeout of its own).
on: workflow_dispatch

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chrome version and localhost lookup time
        shell: pwsh
        run: |
          (Get-Item "C:\Program Files\Google\Chrome\Application\chrome.exe").VersionInfo.ProductVersion
          node -e "const d=require('dns').promises;(async()=>{for(const h of ['localhost','127.0.0.1']){const t=Date.now();try{const a=await d.lookup(h,{all:true});console.log(h,JSON.stringify(a),(Date.now()-t)+' ms')}catch(e){console.log(h,'failed',e.code,(Date.now()-t)+' ms')}}})()"

      - name: Socket-wall test with Playwright API trace
        env:
          DEBUG: 'pw:api,pw:browser'
        run: npx vitest run test/integration/RenderHtmlPreviewLive.test.ts -t "reaches no local socket" --reporter=verbose
