config_version: 2
#
# Run:
#   forge-llamacpp-bridge config/bridge.yaml
#
# Forge (bridge mode): apiBase http://127.0.0.1:9099/v1, apiKey = bridge.api_key,
# model id = one of the keys under models: (referenced via bridge_config in config.yaml).
#
# NOTE: The Python bridge (app.py) must be updated to read the v2 schema before
# this file is passed to it. Forge's TypeScript loader already handles v2.

bridge:
  api_key: "forge-local-change-me"
  bind_host: "127.0.0.1"
  bind_port: 9099
  # Strip <think>/<channel> markup from responses unless model has think: true.
  # Per-model strip_thinking_channels: false disables stripping for that model.
  strip_thinking_channels: true
  # llama-server processes to keep alive simultaneously (incremental ports 8080+).
  max_simultaneous_models: 4

providers:
  llama_cpp:
    binary: "N:/downloads/llama.cpp-b9402/llama-server.exe"
    host: "127.0.0.1"
    base_port: 8080
  ollama_local:
    type: ollama
    endpoint: "http://127.0.0.1:11434"
  xai:
    type: xai
    api_key_secret: xai
  openrouter:
    type: openrouter
    api_key_secret: openrouter
  openai:
    type: openai
    api_key_secret: openai

# Flags inherited by every llama.cpp runtime profile. Runtime or model values override.
runtime_defaults:
  llama_cpp:
    n_gpu_layers: -1       # --n-gpu-layers: offload all layers to GPU
    n_batch: 512           # --batch-size: prompt-processing batch
    type_k: 8              # --cache-type-k q8_0
    type_v: 8              # --cache-type-v q8_0
    flash_attn: true       # --flash-attn: required for large ctx

# Named runtime profiles. per_slot_ctx = num_ctx / n_parallel.
# Semantic names avoid encoding numbers that go stale when ctx changes.
runtimes:
  main_agent:
    # 1 slot × 131072 ctx = 131072 per slot. Full context for deep coding tasks.
    provider: llama_cpp
    n_parallel: 1
    num_ctx: 131072
  main_agent_256k:
    # 1 slot × 262144 ctx = 262144 per slot.
    provider: llama_cpp
    n_parallel: 1
    num_ctx: 262144
  worker_pool:
    # 4 slots × 32768 ctx = 131072 total. Concurrent reviewer / task executor.
    provider: llama_cpp
    n_parallel: 4
    num_ctx: 131072
  worker_pool_large:
    # 8 slots × 32768 ctx = 262144 total. High-throughput worker fleet.
    provider: llama_cpp
    n_parallel: 8
    num_ctx: 262144
  vision_only:
    # 1 slot × 32768 ctx. Load mmproj on the model entry.
    provider: llama_cpp
    n_parallel: 1
    num_ctx: 32768

# Reusable sampling parameter sets. Models reference by name via `sampling:`.
sampling_profiles:
  gemma_coding:
    temperature: 0.6
    top_p: 0.95
    top_k: 64
    min_p: 0.0
    seed: 0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    repeat_last_n: 64
    stop: "<|im_end|>"
    max_tokens: 98304

  qwen_coding:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    max_tokens: 98304
    preserve_thinking: true   # keep reasoning traces across turns (Qwen-specific)

  ollama_local:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 131072

  ollama_cloud_64k:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 65536

  ollama_cloud_32k:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 32768

  xai_default:
    temperature: 0.7
    max_tokens: 30000

  openrouter_default:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 16384

# Shared system prompts. Models reference by name via `prompt:` → resolved as system_prompt.
# Forge Relay workers use their own hardcoded prompts (subagentLoop.ts) — these are bridge-only.
prompts:
  forge_coding_agent: |
    You are Forge, a local AI coding assistant running inside VS Code.
    You have tools available: read_file, write_file, replace_in_file, list_directory, search_code, run_terminal, git_status, git_diff, and more.
    ALWAYS use tools to accomplish tasks. Never describe what you would do - do it by calling the tools directly.
    When the user asks you to read, audit, or investigate files, call read_file immediately. Do not summarize what you plan to do.
    After each tool result, continue calling tools until the task is complete, then give a short summary.

