# =============================================================================
# Forge — example configuration
# =============================================================================
#
# QUICK START
#   1. In your project, create a folder named  .forge
#   2. Copy this file into it and rename it to  config.yaml
#      (final path: <your-project>/.forge/config.yaml)
#   3. Edit the two things that CANNOT be guessed:
#        - llama_server.binary   -> where your llama-server executable lives
#        - models[].gguf_path    -> where your .gguf model file lives
#   4. Set `active_model` to the name of the model you want on startup.
#   5. Reload the VS Code window.
#
# Forge will not start a local model until those paths are real. If a path is
# wrong it says so out loud — it never silently falls back to something else.
#
# You do NOT need every section below. The only required keys are `models` and
# `active_model`; `llama_server.binary` is required if you run a local GGUF.
# Everything else has a sensible default and is here to be discovered.
#
# API KEYS ARE NEVER STORED IN THIS FILE.
# Use the Command Palette -> "Forge: Set Cloud Provider Token". Keys go into VS
# Code SecretStorage. This file only ever names the secret (`api_key_secret`),
# so it is safe to commit.
#
# -----------------------------------------------------------------------------
# THE MENTAL MODEL — three layers decide what a request looks like
# -----------------------------------------------------------------------------
#   models:   one entry per GGUF / endpoint / CLI. FACTS ONLY — where it lives,
#             how big its context is. Spawn-time facts for llama.cpp go under
#             `spawn:`. Vision is auto-derived from `mmproj_path` (you do not
#             write `capabilities: [vision]`).
#   groups:   settings shared by a family of models — the provider, the endpoint,
#             the VRAM budget, the sampling recipe. A model joins with `group:`.
#   defaults: request-time fields shared by EVERY model (system prompt, sampling).
#   profiles: request-time role presets, picked with `active_model: name@profile`.
#
#   Request-time precedence:  defaults  <  group  <  model fields  <  profile
#   Spawn-time precedence:    group.spawn  <  model.spawn
# =============================================================================

# Which model to load on startup. Either `name` or `name@profile`.
# This MUST match one of the `name:` values under `models:` below.
active_model: my-local-model@main

# trace | debug | info | warn | error. Defaults to info. Set here, this WINS over
# the `forge.logLevel` VS Code setting — that setting only applies when this key
# is absent.
#
# `debug` additionally surfaces the per-request prompt-cache line in the Forge
# output channel:
#     [cache] prompt=24610 cached=24102 (97.9%) evaluated=508
# `cached` is how much of the prompt llama-server reused from its KV cache
# instead of re-running it, so it is the fastest way to tell whether Forge is
# keeping your prompt prefix stable. High 90s is healthy on an agent turn; a
# drop to 0 on a conversation that only grew means something rewrote the HEAD of
# the prompt. See docs/plans/PROMPT_PREFIX_STABILITY_PLAN.md.
# log_level: debug

# -----------------------------------------------------------------------------
# Project memory
# -----------------------------------------------------------------------------
# Forge can drop a small FORGE.md into your project as a scratchpad of durable
# project instructions. The agent reads it automatically every turn; it only
# writes to it when you explicitly ask it to remember something.
forge_instructions:
  auto_create: true

custom_instructions: >-
  Use the repository-specific FORGE.md injected by Forge.
  Keep it concise and update it only when the user explicitly asks to record
  durable project instructions.

# -----------------------------------------------------------------------------
# Permissions — what the agent is allowed to do
# -----------------------------------------------------------------------------
# READ THIS BEFORE EDITING. The block is all-or-nothing: as soon as a
# `permissions:` key exists, every group you do NOT list falls back to its
# schema default, which is mostly `false`. Writing only an `exec:` block
# silently disables web search, file deletion and git writes.
#
# So: keep all five groups present and flip individual booleans. If you delete
# this block entirely you get the defaults, which are deliberately cautious.
#
# Every action is still gated by the per-action confirmation prompt in the
# sidebar — these switches decide which tools the model is even TOLD about.
permissions:
  fs:
    read: true
    write: true
    # `delete: false` does not just refuse — it removes `delete_file` from the
    # tool list entirely, so the model does not know it exists and reaches for a
    # shell `rm` instead (which is denied). If you want deletes, say so here.
    delete: true

  exec:
    # Bounded, structured, shell-free commands + read-only inspection.
    headless: true
    # Terminal commands are PASTE-ONLY: Forge types the command into your
    # terminal but never sends the final Enter. You press it.
    terminal: false

  git:
    read: true
    # Grants four structured, flag-free tools: create_branch, switch_branch,
    # stage, commit. This is NOT a security boundary — with exec.headless on,
    # the agent can already run git directly. The real guard is the denylist
    # (reset --hard, clean -f, checkout --, restore, push, rebase, branch -D,
    # stash drop/clear, filter-branch), which is always on.
    write: false

  net:
    # Requires a search key — see the `search:` section below.
    search: false
    # web_fetch is GET-only and SSRF-guarded (loopback, link-local and private
    # ranges are rejected). The residual risk is prompt injection from page
    # content, which is inherent to reading the web.
    fetch: false

  agents:
    # Allows delegating a task to a local CLI agent (claude / codex below).
    delegate: false

# -----------------------------------------------------------------------------
# llama.cpp — required only if you run local GGUF models
# -----------------------------------------------------------------------------
llama_server:
  # The llama-server executable from your llama.cpp build. No default — Forge
  # cannot guess this, and will tell you plainly if it is missing.
  #   Windows:      "C:/llama.cpp/llama-server.exe"
  #   macOS/Linux:  "/usr/local/bin/llama-server"
  binary: 'C:/path/to/llama.cpp/llama-server.exe'
  host: '127.0.0.1'
  port: 8080
  flash_attn_default: true

# -----------------------------------------------------------------------------
# Optional conveniences
# -----------------------------------------------------------------------------

# Summarise the conversation automatically as it approaches the context limit.
auto_compact:
  enabled: true
  at: 0.85 # trigger at 85% of the per-conversation context window
  resume: true # carry on with the task after compacting

# Remote control is default-deny. Provider tokens and paired owner IDs are
# stored through VS Code SecretStorage, never in this file.
remote:
  enabled: false
  queue_limit: 5
  max_message_chars: 12000
  rate_limit_per_minute: 30
  auth:
    # 0 disables only inactivity expiry; TOTP still locks after restart or /lock.
    inactivity_timeout_minutes: 30
  attachments:
    # Stored below .forge/remote-inbox, never as tracked project files.
    enabled: false
    # 1-365 days; null keeps attachments forever (no pruning).
    retain_days: 30
    accept_pdf: true
  # Aliases are the only remote workspace-switch targets; paths are never
  # inferred from an incoming Telegram command.
  workspace_aliases: {}
  # Example:
  #   ssuno:
  #     path: N:/vs code apps/Ssuno
  #     display_name: Ssuno
  telegram:
    enabled: false
  whatsapp:
    enabled: false # experimental linked-device adapter; see docs/REMOTE_CONTROL.md

# Voice: spoken input and spoken replies over the remote channel (Telegram).
# Off by default, and there are no default paths on purpose -- a wrong guess at
# where a 3 GB model lives fails at record time with a bare non-zero exit.
#
# The engine and model size are decided, not tunable: whisper.cpp because it is
# one .exe plus one .bin where faster-whisper needs a CUDA runtime the user has
# to install, and large-v3 because `turbo` was measured hallucinating an outro.
voice:
  enabled: false
  # whisper-cli.exe from a CUDA build of whisper.cpp.
  # whisper_binary: C:/tools/whisper.cpp/build/bin/Release/whisper-cli.exe
  # ggml-large-v3.bin. Check the file size -- a truncated download still loads.
  # whisper_model: C:/tools/whisper.cpp/models/ggml-large-v3.bin
  # `auto` detects per utterance; an ISO code ("en", "el") forces one.
  language: auto
  # Which device decodes. Omit the block entirely and whisper-cli keeps its own
  # defaults: GPU on, device 0, 4 threads, 5 beams, flash-attn on. A CUDA build
  # already uses the GPU, so this is about WHICH card, not whether.
  compute:
    gpu: true
    # `-dev N`, a CUDA ordinal. This is llama.cpp's device order, which need NOT
    # match nvidia-smi's -- read it off whisper-cli's own startup banner, which
    # prints every device it found by name. Point it at the card the chat model
    # is not using.
    # device: 1
    # threads: 8      # only matters with `gpu: false`
    # beam_size: 5    # lower is faster and more literal; 1 is greedy
    # flash_attn: true
  server:
    # Keep the model behind a local whisper-server between notes. This cuts the
    # measured ~5.5 s model load to a ~0.3 s warm request, at ~3.6 GB VRAM.
    enabled: false
    # Build with: cmake --build build --config Release --target whisper-server
    # binary: C:/tools/whisper.cpp/build/bin/Release/whisper-server.exe
    port: 8092
    # Zero keeps it resident until this VS Code window closes.
    idle_timeout_ms: 600000
    confirm_on_start: true
  # Decoder bias: a vocabulary list, not an instruction. whisper.cpp truncates
  # it at 224 tokens. Add the terms it mishears -- domain nouns and proper names
  # are what it gets wrong.
  bias_prompt: ""
  # Trailing-silence trim. The same filter that drops a spurious final line also
  # clips soft consonants and short negations, so off is the safe direction.
  trim_silence: true
  input:
    max_bytes: 26214400 # 25 MiB, rejected before anything is decoded
    max_seconds: 300 # rejected from the client-reported duration
  # Spoken replies via Piper. Flagged separately from input because they are
  # different capabilities with different failure modes, and input is useful on
  # its own. Nothing is bundled: the Greek JOY voice is CC BY-NC 4.0, so both
  # paths point at your own Piper install. Piper is ONNX and CPU-only unless
  # your build ships the onnxruntime CUDA provider.
  output:
    enabled: false
    # piper_binary: C:/tools/piper/piper.exe
    # voices_dir: C:/tools/piper/voices
    voice_en: en_US-amy-medium
    voice_el: el_GR-joy-medium
    # Past this a spoken reply is truncated at a sentence boundary and told to
    # read the rest in the written message. Long voice notes cannot be skimmed.
    max_chars: 1200

# How many models may be loaded at once across all VS Code windows.
# Local GGUFs are VRAM-bound; raise this only if you have the memory.
max_simultaneous_models: 4

# Let other Forge VS Code windows on this machine borrow a compatible, already
# running llama.cpp process instead of each spawning their own copy.
shared_runtime:
  enabled: true

# Small local HTTP API for external tools (scripts, Forge Relay). Off by
# default; nothing outside your machine can reach it.
control_server:
  enabled: false
  port: 8799

# Web search. Bring your own key: Command Palette -> "Forge: Set Cloud Provider
# Token", using the secret name below. Also needs `permissions.net.search: true`.
# search:
#   provider: tavily          # tavily | brave
#   secret_key_name: forge.tavily.apiKey
#   max_results: 5

# Local semantic code search (the `search_codebase` tool). Spawns a SECOND
# llama-server on its own port holding a small embedding model (~265 MB VRAM)
# alongside your chat model. The index is a plain JSON file under .forge/ —
# no native dependencies, nothing leaves your machine.
# embeddings:
#   enabled: true
#   model_path: "C:/path/to/embeddinggemma-300m-Q4_0.gguf"
#   port: 8091
#   # EmbeddingGemma is trained with task prefixes; using them is a large win.
#   # Measured on a real repo (2679 chunks, 10 queries): MRR 0.384 -> 0.634.
#   prompt_style: gemma
#   auto_index_on_search: true
#   confirm_on_start: true
#   idle_timeout_ms: 120000
#   max_file_size_kb: 256
#   # Scope this deliberately. The schema default is `**/*`, which happily
#   # embeds package-lock.json and every stray file in your repo.
#   # These globs are anchored at the WORKSPACE ROOT and are depth-agnostic on
#   # purpose: "src/**" would never reach a nested subproject/src/**.
#   include_globs: [ "**/src/**", "**/test/**", "**/tests/**", "**/docs/**" ]
#   exclude_globs: [ "**/node_modules/**", "**/dist/**", "**/out/**", "**/.git/**", "**/.forge/**" ]

# -----------------------------------------------------------------------------
# Request-time defaults — the base layer under every model and profile
# -----------------------------------------------------------------------------
defaults:
  # Tool calls allowed in a single turn before Forge stops the loop. This is a
  # runaway guard, NOT a judgement about how big a task may be — the built-in
  # default of 500 permits long-running implementation work while retaining a
  # finite runaway guard.
  max_tool_rounds: 500

  system_prompt: |
    You are Forge, a local AI coding assistant running inside VS Code.
    ALWAYS use tools to accomplish tasks. Never describe what you would do - do it by calling the tools directly.
    When the user asks you to read, audit, or investigate files, call read_file immediately. Do not summarize what you plan to do.
    After each tool result, continue calling tools until the task is complete, then give a short summary.

  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 32768

# -----------------------------------------------------------------------------
# Profiles — request-time role presets
# -----------------------------------------------------------------------------
# Select one by suffixing the model name: `active_model: my-local-model@main`.
# One loaded model can serve every role, so you do not need a separate entry
# per role. Precedence: defaults < group < model fields < profile.
profiles:
  # Interactive coding driver — the everyday one.
  main:
    think: true
    reasoning_effort: medium

  # Plans and delegates, still reasons.
  subcoordinator:
    think: true
    reasoning_effort: low

  # Headless worker: no reasoning, tight sampling, for dispatched sub-tasks.
  worker:
    think: false
    reasoning_effort: none
    sampling:
      temperature: 0.2

# Optional back-compat shim: map an old model name to a current one, so
# anything still dispatching by the old name keeps working.
# aliases:
#   my-old-model-name: my-local-model

# =============================================================================
# MODELS
# =============================================================================
# `name` is what you see in the picker AND, for cloud providers, the model id
# sent upstream verbatim — so cloud names must match the provider's id exactly.
# Local GGUF entries can be named whatever you like.
models:
  # ---------------------------------------------------------------------------
  # 1. Local GGUF via llama.cpp — the main event
  # ---------------------------------------------------------------------------
  - name: my-local-model
    # The only line you MUST change. Absolute path to your .gguf file.
    gguf_path: 'C:/path/to/models/your-model-Q4_K_M.gguf'

    # OPTIONAL: vision projector. Its mere presence turns on image support —
    # do not also write `capabilities: [vision]`.
    # mmproj_path: "C:/path/to/models/mmproj-F16.gguf"

    # OPTIONAL: drop images from the model-facing copy once this many later USER
    # messages exist, to reclaim context on long conversations. Counts user turns,
    # not tool rounds, so a tool-heavy round cannot evict an image you just
    # attached. `0` = keep it for the turn it arrived in, drop it on your next
    # prompt. OMIT to never age images out (the default). 4 is a sane starting
    # point; there is no implicit fallback, so nothing happens until you set it.
    # image_retention_turns: 4

    think: true
    reasoning_effort: low

    spawn:
      # TOTAL context across all slots. Per-conversation context is
      # num_ctx / n_parallel — with n_parallel: 4, a num_ctx of 131072 gives
      # each conversation 32768, not 131072. This trips people up constantly.
      num_ctx: 32768
      # Concurrent slots. 1 = the interactive driver gets the whole window.
      n_parallel: 1
      extra_llama_server_args:
        # Cap thinking so the model cannot spend a whole turn reasoning.
        - '--reasoning-budget'
        - '3072'
        # What llama.cpp appends when that budget is hit. Nudging the model back
        # toward tool calls works far better than letting it stall.
        - '--reasoning-budget-message'
        - 'I have been reasoning too long. If I am unsure whether a tool exists, or whether a path is right, I should call it and read the result instead of reasoning further.'
        # How much of the prompt gets re-evaluated when an edit lands mid-prompt.
        # llama.cpp reuses the longest prefix its slot already holds, but on
        # hybrid/recurrent (Qwen GDN) and sliding-window (gemma) models it can
        # only rewind to a context CHECKPOINT, never to an arbitrary token — so
        # this spacing is the real granularity of that reuse. At the default
        # 8192, an edit to the last message of a 31K prompt still re-evaluated
        # 7272 tokens (~11 s); at 1024 it cost 32 tokens (~0.6 s).
        #
        # Cheap, not free: no measurable VRAM, but ~300 MB of HOST RAM at a 31K
        # prompt, since checkpoints live in RAM under --cache-ram (default 8192
        # MiB). Measure AFTER processing a prompt -- none exist at load.
        # Measured on Qwen3.8-27B (GDN) with llama.cpp b10621 and b10673; the
        # flag is spelled --ctx-checkpoints/--swa-checkpoints so it should serve
        # gemma's SWA cache too, but that has not been measured.
        # See docs/plans/SLOT_AFFINITY_AND_CHECKPOINTS_PLAN.md.
        - '--checkpoint-min-step'
        - '1024'

    group: llamacpp-local

  # ---------------------------------------------------------------------------
  # 2. Ollama, running locally
  # ---------------------------------------------------------------------------
  # Requires the Ollama daemon plus `ollama pull <model>` first. `name` must be
  # the exact Ollama tag.
  - name: 'qwen3:8b'
    num_ctx: 32768
    sampling: { max_tokens: 32768 }
    group: ollama-local

  # ---------------------------------------------------------------------------
  # 3. External CLI agents — Claude Code and Codex
  # ---------------------------------------------------------------------------
  # These shell out to a coding CLI already installed and logged in on your
  # machine. Auth is that CLI's own login (`claude` / `codex`) and uses your
  # existing subscription — Forge stores NO key for them and sends no traffic
  # of its own. They run with their OWN tools, not Forge's.
  #
  # Requires `permissions.agents.delegate: true` above.
  #
  # Find the paths with:  where claude   /   where codex     (Windows)
  #                       which claude   /   which codex     (macOS/Linux)
  - name: claude-code
    provider: cli
    cli: 'C:/Users/<you>/AppData/Roaming/npm/node_modules/@anthropic-ai/claude-code/bin/claude.exe'
    comment: 'Claude Code CLI — external agent, uses your existing Claude subscription'

  - name: codex
    provider: cli
    cli: 'C:/Users/<you>/AppData/Roaming/npm/node_modules/@openai/codex/bin/codex.js'
    comment: 'Codex CLI — external agent, uses your existing OpenAI subscription'

  # ---------------------------------------------------------------------------
  # 4. Cloud, via an OpenAI-compatible endpoint (optional)
  # ---------------------------------------------------------------------------
  # Opt-in and off unless you configure it. Store the key with
  # "Forge: Set Cloud Provider Token" under the secret name in `api_key_secret`.
  # `name` is sent upstream verbatim, so it must be the provider's exact id.
  # - name: "some-vendor/some-model"
  #   api_key_secret: my-provider
  #   num_ctx: 131072
  #   # `capabilities` REPLACES the group's list wholesale — it does not merge.
  #   # So restate tool-call/long-context whenever you add vision.
  #   capabilities: [tool-call, long-context]
  #   sampling: { max_tokens: 32768 }
  #   group: openai-compatible-cloud

# -----------------------------------------------------------------------------
# External MCP servers (optional)
# -----------------------------------------------------------------------------
# stdio MCP servers bridged into the tool registry, read-only and auto-discovered.
# Cap each server's output: an uncapped result can fill the whole context window
# and stall the turn with no visible error.
# mcp_servers:
#   - name: my-server
#     command: "C:/path/to/my-mcp-server.exe"
#     max_result_chars: 20000

# =============================================================================
# GROUPS — shared settings for a family of models
# =============================================================================
groups:
  llamacpp-local:
    provider: llama.cpp
    think: true

    # ---- VRAM: the part that actually bites ---------------------------------
    # n_gpu_layers: 999, NOT -1.
    #   `-ngl -1` is AUTO-FIT, not "all". It holds back a ~1024 MiB margin and
    #   parks whatever it thinks will not fit on the CPU. The tell in the loader
    #   log is "tensor overrides to CPU are used with mmap enabled" — your model
    #   is silently running partly on CPU at a fraction of the speed. On hybrid
    #   (Gated Delta Net) models, ONE stranded CPU layer disables the fused
    #   kernel for the WHOLE model: measured 26 t/s -> 12 t/s.
    #   Setting it explicitly also disables auto-fit, so the num_ctx budget is
    #   yours to keep. An over-budget load then FAILS LOUDLY at startup instead
    #   of degrading silently — which is what you want.
    #
    # If a load fails, cut `num_ctx` — do not restore auto-fit.
    #
    # Also: on Windows, WDDM pages VRAM over PCIe rather than refusing to
    # allocate. Leaving under ~1 GB free does not crash, it just goes very slow
    # (measured 35 t/s -> 5 t/s). Budget for headroom.
    #
    # type_k/type_v q4_0 quantises the KV cache, which is usually where the
    # context window's memory goes. q8_0 is higher quality and roughly double.
    spawn:
      # Conservative default for arbitrary GGUFs. The 2,048 Qwen result below
      # is model- and GPU-specific; do not copy it to a tight model blindly.
      n_batch: 512
      type_k: q4_0
      type_v: q4_0
      flash_attn: true
      n_gpu_layers: 999

    # Qwen 3.8 27B Q3_K_XL MTP on the 16 GB RTX 5060 Ti used this measured
    # profile at a 50k context. It is NOT a general GGUF recipe: it requires a
    # Qwen MTP-capable model and should be benchmarked on the target hardware.
    #
    # n_batch: 2048
    # extra_llama_server_args:
    #   - "--ubatch-size"
    #   - "1024"
    #   - "--spec-type"
    #   - "draft-mtp,ngram-mod"
    #   - "--spec-draft-n-max"
    #   - "2"
    #   - "--spec-ngram-mod-n-match"
    #   - "16"
    #   - "--spec-ngram-mod-n-min"
    #   - "16"
    #   - "--spec-ngram-mod-n-max"
    #   - "64"

    # Sampling recipes are model-family specific — use the one the model's
    # authors publish. Two worth knowing:
    #   Gemma:  temperature 1.0, top_p 0.95, top_k 64
    #   Qwen:   temperature 0.6, top_p 0.95, top_k 20
    # Use `repeat_penalty`, NOT `repetition_penalty` — llama.cpp ignores unknown
    # keys in SILENCE, so the wrong spelling does nothing and never says so.
    # 1.0 is off; 1.05-1.15 helps if output repeats; above 1.2 hurts coherence.
    sampling: { top_k: 64, top_p: 0.95, min_p: 0, repeat_penalty: 1.0 }

    # Cap or disable individual tools for this family. A limit of 0 un-advertises
    # the tool completely, so its schema stops being rendered into every prompt —
    # useful for keeping a small local model's tool list short and reliable.
    # tool_call_limits:
    #   some_noisy_tool: 0

  ollama-local:
    provider: ollama
    endpoint: http://127.0.0.1:11434
    think: true
    reasoning_effort: medium

  # openai-compatible-cloud:
  #   provider: openai-compatible
  #   endpoint: https://api.your-provider.com
  #   capabilities: [tool-call, long-context]
  #   sampling: { temperature: 0.7, max_tokens: 32768 }
