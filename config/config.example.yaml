# ===========================================================================
# C. LOCAL RUNTIME & RESOURCES
# ===========================================================================

llama_server:
  binary: "xxxx/llama-server.exe"
  host: "127.0.0.1"
  port: 8080
  flash_attn_default: true

max_simultaneous_models: 4

shared_runtime:
  enabled: true

control_server:
  enabled: true
  port: 8799

benchmark:
  base_url: "http://127.0.0.1:8084"

auto_compact:
  enabled: true
  at: 0.85
  resume: true

search:
  provider: tavily
  secret_key_name: forge.tavily.apiKey
  max_results: 20

embeddings:
  enabled: false
  model_path: "xxxx/embeddinggemma-300m-Q4_0.gguf"
  port: 8091
  device: none         # CPU: the 300M embedder is fast there and keeps GPU VRAM free
  prompt_style: gemma
  auto_index_on_search: true
  confirm_on_start: true
  idle_timeout_ms: 120000
  max_file_size_kb: 256
  include_globs: [ "**/src/**", "**/test/**", "**/tests/**", "**/docs/**" ]
  exclude_globs: [ "**/node_modules/**", "**/dist/**", "**/out/**", "**/.git/**", "**/.forge/**" ]

# generate_image tool (xAI grok-imagine, ~$0.04 per image).
image_generation:
  default: grok-imagine
  output_dir: generated-images
  backends:
    - name: grok-imagine
      provider: xai
      model: grok-imagine-image-2.0
      api_key_secret: xai
      confirm_each: true

# view_video frame sampling (needs ffmpeg/ffprobe on PATH or ffmpeg_path).
# frame_max_dimension is the context knob. Measured on a 5 s clip with
# Qwen3.8-27B: unscaled 1920x1088 = 22,501 prompt tokens, 640 px = 2,479,
# 384 px = 983.
video:
  frame_max_dimension: 640

# Reverse image search (SerpApi Google Lens; attachments go to Litterbox for 1 h).
image_search:
  provider: serpapi_lens
  secret_key_name: serpapi
  max_results: 8
  confirm_upload: false   # true = ask before an attachment leaves the machine
  thumbnails: 4           # sidebar tool row + Telegram photos; 0 = off
  timeout_ms: 90000       # type "all" measured ~52 s

# ===========================================================================
# D. REMOTE SURFACES  (voice = TTS/STT; remote = Telegram/WhatsApp)
# ===========================================================================

voice:
  enabled: false
  whisper_binary: "xxxx/whisper-cli.exe"
  whisper_model: "xxxx/ggml-large-v3.bin"
  language: auto
  compute:
    gpu: true
    device: 2   # whisper.cpp CUDA ordinal: the RTX 3060
  bias_prompt: "Forge, VRAM, CUDA, GGUF, llama.cpp, Ollama, TypeScript, esbuild, vitest, git, commit, npm"
  input:
    max_bytes: 26214400
    max_seconds: 300
  trim_silence: true
  output:
    enabled: false
    piper_binary: "xxxx/piper.exe"
    voices_dir: "xxxx/voices"
    voice_en: en_US-amy-medium
    voice_el: el_GR-joy-medium
    max_chars: 1200

remote:
  enabled: false
  queue_limit: 5
  max_message_chars: 20000
  rate_limit_per_minute: 30
  # LiteBeam WakeSleep relay receiver; secret in SecretStorage (forge.remote.wakeRelay.secret).
  wake_relay:
    enabled: false
    host: 0.0.0.0
    port: 8742
    relay_ip: 0.0.0.0
  telegram:
    enabled: false
  whatsapp:
    enabled: false
  auth:
    inactivity_timeout_minutes: 500
  attachments:
    enabled: true
    accept_pdf: true
    retain_days: null
  contacts:
    enabled: false
    web:
      enabled: false
      max_results: 5
      max_fetch_bytes: 200000
      timeout_ms: 15000

# Agent bus: ask_live_session writes straight into a running Claude Code / Codex session.
agent_bus:
  enabled: true
  # Default session for ask_live_session; set a stable name with /rename.
  # claude_session: my-session   # pin one; list them with Forge: Show Live Claude Sessions
  # codex_thread: <thread id>
