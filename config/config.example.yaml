# =============================================================================
# Forge — example configuration (a complete, working setup)
# =============================================================================
# QUICK START
#   1. Create <your-project>/.forge/ and copy this file there as config.yaml.
#   2. Replace every `xxxx/` with the real folder on your machine:
#        llama_server.binary, models[].gguf_path / mmproj_path / --model-draft,
#        and the optional tools (embeddings, voice, MCP servers, CLI agents).
#   3. Delete the model entries you do not have, and point `active_model` at
#      one you kept. Every `name` in `aliases` must still exist.
#   4. Reload the VS Code window.
#
# Forge never falls back silently: a wrong path is reported, not guessed.
# API keys are NEVER stored here — use "Forge: Set Cloud Provider Token"; this
# file only names the secret (`api_key_secret`).
#
# Precedence — request time: defaults < group < model < profile.
#              spawn time:   group.spawn < model.spawn.
# The GPU layout below is 2x RTX 5060 Ti 16 GB (CUDA0/1) + RTX 3060 12 GB
# (CUDA2); re-tune `--device` / `--tensor-split` for your cards. An external
# drafter (--model-draft) must sit on the LAST --device.
# =============================================================================

# ===========================================================================
# A. CORE BEHAVIOR
# ===========================================================================

active_model: qwen38-27b-dflash2-ud-q6k-vision

log_level: debug

forge_instructions:
  auto_create: true

custom_instructions: >-
  Use the repository-specific FORGE.md injected by Forge (or AGENTS.md only as a compatibility fallback). Keep it concise and update it only when the user explicitly asks to record durable project instructions.

# WARNING: FULL PERMISSIONS. Every one of these is OFF by default; this example
# turns them ALL ON, so the agent may delete files, run terminal and headless
# commands, write to git, delegate to other agents, and search/fetch the web.
# Writes, terminal and git actions still ask for confirmation — unless you turn
# that off with /clanker. Review this block before your first session and set
# anything you do not want to false (or delete the line).
permissions:
  fs:
    delete: true
  exec:
    headless: true
    terminal: true
  git:
    write: true
  agents:
    delegate: true
  net:
    search: true
    fetch: true

# Persistent agent jobs (docs/JOBS.md). Opt-in: set `enabled: true` to start
# the scheduler. With no jobs defined it is inert, but it is off by default.
jobs:
  enabled: false
  # Hosts a job may fetch from.
  allowed_hosts:
    - api.github.com
    # Asset downloads start on github.com and 302 to a CDN; the host gate checks
    # every hop, and GitHub serves assets from BOTH of these CDNs depending on
    # the asset, so all four are required for llamacpp_update.
    - github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
  max_concurrent: 2

# ===========================================================================
# B. MODEL DEFINITIONS  (x_shared defines the &reasoning_budget_message anchor — must stay above models)
# ===========================================================================

x_shared:
  reasoning_budget_message: &reasoning_budget_message " Stop reasoning now. Do not repeat, reconsider, or restate conclusions already reached.
   If you have decided the next action, take it immediately. If one specific fact is missing, verify only that fact with the appropriate tool.
    Otherwise end reasoning and produce the answer or tool call now."

defaults:
  max_tool_rounds: 1000
  system_prompt: |
    You are Forge, an autonomous software-engineering agent operating inside VS Code.

    Complete the user's requested task using the available workspace, tools, and evidence. Prefer direct action over narrating intended actions.
    For workspace tasks, inspect relevant existing code before making assumptions or changes. Search for existing implementations before creating new mechanisms,
     and prefer extending existing architecture over duplicating it.
    FRESHNESS AND UNCERTAINTY
    When uncertain about a technical fact that may have changed since training — including APIs, libraries, model/runtime support, CLI flags, versions, bugs, compatibility, or current behavior 
    — verify it from current authoritative online sources before relying on internal knowledge or extended reasoning.
    Prefer primary sources such as official documentation, upstream repositories, release notes, issues, and source code. Use internal knowledge directly for stable facts.
    PATHS AND CODE SEARCH
    When locating a file, path, executable, symbol, configuration value, or implementation, search the workspace and relevant source/configuration first.
    If code or configuration already contains or constructs the path, trace that path instead of searching the filesystem for the same resource.
    Prefer targeted searches by filename, symbol, string, or known directory. Never recursively search an entire drive or large filesystem tree unless
     targeted workspace/code searches have failed and a broad filesystem search is genuinely necessary.
    EXECUTION
    Make the smallest coherent change that fully satisfies the request. Preserve existing behavior outside the requested scope. 
    Treat explicit scope restrictions as hard constraints.
    After each result, determine what specific information or action is still required. If something necessary remains, continue. 
    If the requested task is complete and sufficient evidence exists, stop investigating and answer.
    Do not repeat equivalent searches, reread information already available, or investigate unrelated areas without a concrete unresolved question. 
    At large context sizes, prefer targeted searches and reads over broad scans.
    Do not invent file contents, repository structure, command output, test results, or implementation details. Do not claim something was changed, 
    fixed, verified, or succeeded unless evidence supports it.
    Continue autonomously through ordinary multi-step work. Do not stop merely to report progress or ask for confirmation between routine steps. 
    Ask only when required information cannot be obtained, a materially different choice requires the user's decision, or proceeding would exceed the requested scope.
    When verification is appropriate, use the narrowest useful verification. Do not perform unrelated testing, cleanup, or refactoring.
    Once the requested work is complete, stop. Do not continue investigating merely because more investigation is possible.
    Finish with a concise summary of what was done or found, relevant verification, and genuine unresolved issues.


  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 98304

profiles:
  main:
    think: true
    reasoning_effort: medium
  subcoordinator:
    think: true
    reasoning_effort: low
  worker:
    think: false
    reasoning_effort: none
    sampling:
      temperature: 0.2

