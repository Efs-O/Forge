# Forge starter config — OpenAI-compatible provider
# Replace the endpoint and model name. Store the token with
# "Forge: Set Cloud Provider Token" using the secret name below. A local
# server that takes no key (Strata, LM Studio, vLLM): delete the
# api_key_secret line and Forge sends no Authorization header.

active_model: provider-model-name

models:
  - name: provider-model-name
    provider: openai-compatible
    endpoint: https://REPLACE-WITH-PROVIDER-ENDPOINT.example.com
    api_key_secret: my-provider
    capabilities: [tool-call]

permissions:
  # A coding agent needs to run builds and tests. Every write, delete, command
  # and git action still asks for confirmation unless /clanker is on.
  fs: { read: true, write: true, delete: true }
  net: { search: false, fetch: false }
  exec: { headless: true }
  git: { read: true, write: true }

# The tested agent setup. Auto-compaction and the auto-created FORGE.md are
# off unless named here. max_tokens is a ceiling: each request is clamped to
# the room the context leaves.
forge_instructions:
  auto_create: true

auto_compact:
  enabled: true
  at: 0.85
  resume: true

defaults:
  sampling: { temperature: 0.6, top_p: 0.95, max_tokens: 200000 }
