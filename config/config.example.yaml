# Forge config.example.yaml
# Copy to your VS Code global storage path and edit.
# Windows: %APPDATA%\Code\User\globalStorage\forge\config.yaml
# Linux/Mac: ~/.config/Code/User/globalStorage/forge/config.yaml

active_model: qwen36-27b-q3km

llama_server:
  binary: /path/to/llama-server   # e.g. ~/llama.cpp/build/bin/llama-server
  host: 127.0.0.1
  port: 8080
  n_gpu_layers: -1                 # -1 = offload all layers to GPU
  default_num_ctx: 8192
  n_batch: 512
  n_parallel: 1
  type_k: 8                        # 8 = q8_0 KV cache
  type_v: 8
  flash_attn_default: true
  # n_threads: 8                   # uncomment to pin CPU threads

models:
  - name: qwen36-27b-q3km
    gguf_path: N:/.cache/huggingface/hub/Qwen2.5-Coder-27B-Instruct-Q3_K_M.gguf
    n_gpu_layers: -1
    num_ctx: 8192
    flash_attn: true

  - name: gemma4-31b-it-q3ks
    gguf_path: N:/.cache/huggingface/hub/gemma-3-27b-it-Q3_K_S.gguf
    n_gpu_layers: -1
    num_ctx: 8192
    flash_attn: true

  - name: qwen36-35b-a3b-iq3s
    gguf_path: N:/.cache/huggingface/hub/Qwen2.5-Coder-32B-Instruct-IQ3_S.gguf
    n_gpu_layers: -1
    num_ctx: 8192

  - name: gemma4-26b-a4b-it-q3km
    gguf_path: N:/.cache/huggingface/hub/gemma-3-12b-it-Q3_K_M.gguf
    n_gpu_layers: -1
    num_ctx: 8192
    flash_attn: true

log_level: info

# ── Bridge mode ────────────────────────────────────────────────────────────────
# Set bridge_mode: true to connect to an already-running OpenAI-compatible server
# (e.g. your own llama-server, continue-llamacpp-bridge, or LM Studio).
# Forge will NOT spawn its own process. llama_server.host + port are used as the
# base URL; llama_server.binary is not required in this mode.
#
# bridge_mode: true

# ── Search (opt-in) ────────────────────────────────────────────────────────────
# Store your API key first:  Forge: Set Search API Key  (VS Code command palette)
# Then uncomment one of the blocks below.
#
# search:
#   provider: tavily
#   secret_key_name: forge.tavily.apiKey
#   max_results: 5
#
# search:
#   provider: brave
#   secret_key_name: forge.brave.apiKey
#   max_results: 5
