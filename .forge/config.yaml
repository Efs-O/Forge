    mmproj_path: "N:/GEMMA GGUF UNSLOTH/E4B/mmproj-F16.gguf"
    think: true
    spawn:
      num_ctx: 262144
      n_parallel: 8
      n_batch: 512
      type_k: 8
      type_v: 8
      flash_attn: true
      n_gpu_layers: -1
      extra_llama_server_args: ["--reasoning-budget", "2048"]
    sampling:
      top_k: 64
      min_p: 0.0
      seed: 0
      presence_penalty: 0.0
      repetition_penalty: 1.0
      repeat_last_n: 64
      stop: "<end_of_turn>"

