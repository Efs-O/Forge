groups:
  ollama-local:
    provider: ollama
    endpoint: http://127.0.0.1:11434
    think: true
    reasoning_effort: medium
  ollama-cloud:
    provider: ollama
    endpoint: http://127.0.0.1:11434
    think: true
    reasoning_effort: medium
  openai-compatible-cloud:
    provider: openai-compatible
    endpoint: https://api.cerebras.ai
    sampling: { temperature: 0.7, max_tokens: 32768 }
  llamacpp-gemma4:
    think: true
    spawn: { n_batch: 512, type_k: q8_0, type_v: q8_0, flash_attn: true, n_gpu_layers: 999 }
    sampling: { top_k: 64, top_p: 0.95, min_p: 0, seed: 0, presence_penalty: 0, repeat_penalty: 1.1, repeat_last_n: 64 }
  openrouter-cloud:
    provider: openrouter
    num_ctx: 262144
    capabilities:
      - tool-call
      - long-context
    sampling: { max_tokens: 16384 }
  xai-cloud:
    provider: xai
    sampling: { temperature: 0.7 }
    # reasoning_effort Forge sends when it turns thinking off (the compaction
    # summary, when its budget reserves no reasoning tokens). Unset on xai /
    # openrouter / openai: Forge sends nothing extra, because their models name
    # effort levels differently. openai-compatible defaults to none; llama.cpp
    # and Ollama use enable_thinking: false instead.
    # thinking_off_effort: low
  llamacpp-qwen3:
    spawn:
      num_ctx: 100000
      n_batch: 4096
      n_parallel: 1
      type_k: q8_0
      type_v: q8_0
      flash_attn: true
      n_gpu_layers: 999

    sampling: { temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0, repeat_penalty: 1, max_tokens: 16384 }

  llamacpp-glm5:
    think: true
    spawn:
      num_ctx: 65536
      n_batch: 512
      type_k: q8_0
      type_v: q8_0
      flash_attn: false
      n_gpu_layers: 999
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 0
      repeat_penalty: 1
      max_tokens: 16384

  llamacpp-qwen4exp:
    think: true
    spawn:
      num_ctx: 100000
      n_parallel: 1
      n_gpu_layers: -1
      n_batch: 4096
      type_k: Q8_0
      type_v: Q8_0
      flash_attn: true
      extra_llama_server_args:
        - "--device"
        - "CUDA0,CUDA1"
        - "--split-mode"
        - "layer"
        - "--tensor-split"
        - "1,1"
        - "--ubatch-size"
        - "4096"
        - "--load-mode"
        - "none"
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 0
      repeat_penalty: 1
      max_tokens: 16384

